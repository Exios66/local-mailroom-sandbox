# Specialist extract: corporate_records_specialist on 30 CORPORATE_RECORD docs.
# Subclass-stratified across all 9 test subclasses (proportional to corpus;
# bylaws capped at avail=1). Test has 47 corporate_record rows — N=30 fits.
#
# Efficient conservative Modal posture: 1×L4, max_containers=1, min_containers=0,
# scaledown 600s, job.concurrency=4.
#
#   sandbox run preflight --config config/runs/run-30-corporate-records-specialist.yaml --live
#   sandbox run start --config config/runs/run-30-corporate-records-specialist.yaml --job-mode endpoint --watch
schema: sandbox.run/v1
run_id: run-30-corporate-records-specialist
task: corporate_records_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  # split: test — 47 corporate_record rows; N=30 fits (no train needed)
  split: test
  revision: 46a4d3c240a36671cde0182fff4960f6b8b73aca   # pinned (FAMILY_HF_REVISION)
  strata:
    buckets:
      # corporate_record (47 test rows): proportional quotas → 30
      - doc_class: corporate_record
        sub_buckets:
          - {subclass: subsidiary_list, count: 6}              # avail 10
          - {subclass: charter_amendment, count: 6}            # avail 9
          - {subclass: officer_certificate, count: 4}          # avail 7
          - {subclass: board_resolution, count: 3}             # avail 5
          - {subclass: articles_of_incorporation, count: 3}    # avail 5
          - {subclass: indenture, count: 3}                    # avail 4
          - {subclass: powers_of_attorney, count: 2}           # avail 3
          - {subclass: rights_instrument, count: 2}            # avail 3
          - {subclass: bylaws, count: 1}                       # avail 1
  limit: 30
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B
  vllm:
    max_model_len: 16384
    gpu_memory_utilization: 0.90
    max_num_seqs: 256
    quantization: ""
    revision: ""
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 600
    max_containers: 1
    min_containers: 0
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 4

trace:
  sink: none
  otlp: false
  environment: specialist-30
  tags: [sandbox, job, specialist, corporate]
