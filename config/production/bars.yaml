# Production slice gate bars (docs/superpowers/specs/2026-11-16-production-slice-gate-design.md).
# Pass rule, pooled over the gated classes: wrong-archive rate <= wrong_archive_max, review rate
# <= review_max, 0 run errors, 0 judge_error. A correct archive scores >= quality on the labelled
# fields. merger_agreement is reported but never gated. Per-class bars apply only from a slice of
# per_class_from_n documents; below that they are diagnostic.
quality: 0.90
wrong_archive_max: 0.02
review_max: 0.05
gated: [contract, corporate_record, correspondence, insurance_claim]
min_labelled: 2
per_class_from_n: 500
