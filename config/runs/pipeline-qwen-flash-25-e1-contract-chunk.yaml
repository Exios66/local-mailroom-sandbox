# OBSOLETE PLAN — do not launch. OpenRouter routes never chunk (HF-009): a contract longer than the
# 18,000-char cap below now fails to review instead of being windowed. This file is kept because the
# 2026-11-16 E1 runs locked it (reports/run-ledger.md). A chunked arm runs on Modal/vLLM only.
# Ladder E1 treatment. Contract recall: whole-document (control) vs 15,750-char chunked extraction (treatment).
# Sample: 20 CUAD contracts, 2 from each of the 10 largest subtypes; about 3/4 of the pool is longer
# than one chunk, so most documents exercise chunking. Tuning seed 1115.
# Success: treatment CUAD quality >= control + 0.05 paired, missed clauses down, no false-positive blowup.
# Model (held fixed across the ladder, so the only variable is the marked line): qwen/qwen3.7-flash on
# OpenRouter for every agent node; decision reviewer openai/gpt-6-luna-decisions with the v2 cutoffs.
# Plan: docs/audits/2026-11-15-contract-recall-routing-ladder.md. Base: pipeline-qwen-flash-25-fit-r2.
schema: sandbox.run/v1
run_id: pipeline-qwen-flash-25-e1-contract-chunk
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  strata:
    buckets:
      - doc_class: contract
        count: 20
        sub_buckets:
          - {subclass: "Supply", count: 2}
          - {subclass: "License_Agreements", count: 2}
          - {subclass: "Consulting Agreements", count: 2}
          - {subclass: "IP", count: 2}
          - {subclass: "Service", count: 2}
          - {subclass: "Maintenance", count: 2}
          - {subclass: "Distributor", count: 2}
          - {subclass: "Strategic Alliance", count: 2}
          - {subclass: "Sponsorship", count: 2}
          - {subclass: "Development", count: 2}
  limit: 20
  sample_seed: 1115
  require_task_gt: true   # every document can be scored

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}
  contracts_specialist: {max_input_chars: 18000}   # TREATMENT: 15,750-char windows, judge keeps full coverage

confidence:
  by_class:
    contract: {high: 0.95}
    corporate_record: {high: 0.95}
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50
  max_wall_seconds: 7200
  api_cost_cap_usd: 0.60   # ~2x the r2-derived estimate for this sample, dearest-tier pricing

trace:
  sink: none          # no Docker: spans still mirror to data/traces/<run_id>.spans.jsonl.gz;
                      # compact afterwards with `sandbox traces pack` (zstd Parquet zip)
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, n25, context-fit, routing-calibration, ladder-e1-contract-chunk]
