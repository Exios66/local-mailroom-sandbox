# Staged production label overlays (mailroom_sandbox.staged_overlay), cached in the
# mailroom-issues repository under mailroom_cache/ and selected per run with
# `dataset.staged_overlay: <version>`. A run only ever applies a version pinned here: the
# mailroom-issues commit holding the cut and the sha256 of its MANIFEST.json (which pins every
# overlay file). Pull a pinned cut with `python scripts/pull_staged_overlay.py --version <v>`.
# A new cut is a new entry; never edit an existing one (its runs locked that fingerprint).
#
#   <version>:                    X.Y.P-rc.N, no "v"
#     repo: <owner>/<name>        GitHub repository holding mailroom_cache/
#     commit: <40 hex>            commit to fetch
#     path: vX.Y.0/pre-release/vX.Y.P-rc.N   relative to mailroom_cache/
#     manifest_sha256: <64 hex>   sha256 of that cut's MANIFEST.json
#     base_tag_commit: <40 hex>   Hub tag commit the overlay is a delta against
