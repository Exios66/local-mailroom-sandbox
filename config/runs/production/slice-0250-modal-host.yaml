# Production slice gate, 250 documents (the 100 slice nests inside it and it nests inside the 500 slice).
# Spec: docs/superpowers/specs/2026-11-16-production-slice-gate-design.md
#
# Bars (sandbox run gate; config/production/bars.yaml):
#   - quality >= 0.90 per scorable document on its labelled fields
#   - wrong archives <= 2% and review rate <= 5%, pooled over the gated classes
#     (contract, corporate_record, correspondence, insurance_claim)
#   - 0 run crashes and 0 judge_error
#   - merger_agreement is reported but never gated
#   - per-class bars apply only from slice size 500; below that they are diagnostic
#
# Held-out scope: dataset.exclude_ids_file drops the documents used to tune extraction and
# routing before the draw, so those are never re-drawn. Sorter prompt tuning drew from the
# sorter handoff's train split, so sorter results on this slice are in-sample for the sorter.
#
# Everything but the draw size, caps and run_id is r3's (pipeline-qwen-flash-25-fit-r3):
# prompts, agent routes and knobs, confidence block, decision reviewer, blind routing and
# interim labels, so the gate measures the adopted configuration. Spans mirror locally to
# data/traces/<run_id>.spans.jsonl.gz (trace.sink none), which the gate audit reads.
# api_cost_cap_usd 5: about 2x E3's measured 76k prompt tokens per document.
#
# Modal job-host twin: identical to the endpoint config except run_id and job.mode: modal.
# The engine is still OpenRouter (no GPU). Deploy sandbox-job with OPENROUTER_API_KEY
# loaded first (docs/runbooks/production-slices.md, Modal job-host parity, step 0).
#
# Launch (a human supplies the initials; never launch from an agent):
#   sandbox run preflight --config config/runs/production/slice-0250-modal-host.yaml
#   sandbox run start --config config/runs/production/slice-0250-modal-host.yaml --initials <XX>
#   sandbox run gate --run-id production-slice-0250-modal-host [--prev-run-id <previous slice run id>]

schema: sandbox.run/v1
run_id: production-slice-0250-modal-host
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}   # sorter: vendored sorter_condensed_v5 (the adopted frontrunner)
  agents:   # adopted condensed frontrunners (config/prompts/specialist_condensed_lineage.yaml)
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v3}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 45}
      - {doc_class: corporate_record, count: 34}
      - {doc_class: correspondence, count: 76}
      - {doc_class: insurance_claim, count: 83}
      - {doc_class: merger_agreement, count: 12}
  sample_seed: 3302          # one seed for every slice, so the draws nest
  require_task_gt: true     # every document can be scored
  # Staged v10 label repairs from mailroom-issues mailroom_cache (pinned in config/staged_overlays.yaml):
  # the merged Hub + interim + near-gold + reviewed master, so it replaces interim_labels / near_gold_labels.
  # Pull it first: python scripts/pull_staged_overlay.py --version 9.3.1-rc.5 (docs/staged-label-overlay.md).
  staged_overlay: 9.3.1-rc.5
  exclude_ids_file: config/production/excluded-ids.txt   # tuning documents, dropped before the draw
  draw: ranked   # exclusion-stable order: adding tuning ids keeps the rest of every slice

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95}
    corporate_record: {high: 0.95}
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

job:
  mode: modal
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50         # GPU cap field (validation requires one); OpenRouter spend is capped below
  max_wall_seconds: 10800
  api_cost_cap_usd: 5
  blind_routing: true       # no dataset labels in the graph's state (llm-mailroom #207)

trace:
  sink: none          # no Docker: spans still mirror to data/traces/<run_id>.spans.jsonl.gz
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, production-slice-gate, slice-0250]
