version: 2.1

# One workflow: lint, generated-file checks, a 4-way parallel test job, a
# notebook execution job, coverage gate and the no-session-links guard (.circleci/check_no_session_links.sh).
# lint, checks, test, notebooks and no-session-links start together; coverage waits for test.
#
# Where the time went before (hosted runs, about 10-11 minutes per PR): the
# whole suite ran on one medium container (pytest step about 560s) after a
# fresh `pip install` (about 50s). Now:
#   - the installed virtualenv is cached, keyed on pyproject.toml, so a cache
#     hit skips the install;
#   - the test job runs on 4 parallel containers. CircleCI splits test files
#     by their recorded timings (file-name split on the first run), and each
#     container runs two pytest-xdist workers with --dist loadfile, so
#     process-local unions such as test_pipeline_routing_matrix.WALKED stay
#     on one worker;
#   - each container writes its own coverage data file; the `coverage` job
#     combines them and enforces fail_under from pyproject.toml (84, unchanged).
#     The per-container --cov-fail-under=0 only stops a partial file from
#     failing on its own; the real floor is checked on the combined data.
#   - committed generated files (reports hub, requirements mirrors, CLI
#     reference, runbook docs) are checked in their own `checks` job, so a
#     stale file fails in about a minute instead of after the test shards.
# This is the repo's only CI (there is no .github/workflows/ci.yml). To BLOCK
# merges, mark "ci/circleci: lint", "ci/circleci: checks", "ci/circleci: test",
# "ci/circleci: coverage" and "ci/circleci: no-session-links" as required in the
# branch protection rule for main.

executors:
  py:
    docker:
      - image: cimg/python:3.11-node
    resource_class: small

commands:
  venv:
    description: Restore or build the dev virtualenv (cached on pyproject.toml).
    steps:
      - run:
          # The image tag floats; key the venv on the exact interpreter too, so a
          # patch bump never restores a venv with stale interpreter links.
          name: Record interpreter version for the venv cache key
          command: python --version > .ci-python-version
      - restore_cache:
          keys:
            - venv-v1-{{ arch }}-{{ checksum ".ci-python-version" }}-{{ checksum "pyproject.toml" }}
      - run:
          name: Install dev surface into ~/venv (skipped on a cache hit)
          command: |
            if ! ~/venv/bin/python -c "import mailroom_sandbox" 2>/dev/null; then
              rm -rf ~/venv
              python -m venv ~/venv
              ~/venv/bin/pip install --quiet --upgrade pip
              ~/venv/bin/pip install --quiet -e ".[dev]"
            fi
            # The editable install is a plain .pth pointing at this checkout's
            # src/ (same path on every container), so new modules need no
            # reinstall; only dependency changes do, and they change the key.
            echo 'export PATH="$HOME/venv/bin:$PATH"' >> "$BASH_ENV"
      - save_cache:
          key: venv-v1-{{ arch }}-{{ checksum ".ci-python-version" }}-{{ checksum "pyproject.toml" }}
          paths:
            - ~/venv

jobs:
  no-session-links:
    # Rejects claude.ai links, Claude-Session trailers and "Generated with
    # Claude Code" footers in commit messages and the PR description.
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: No session links or Claude Code footers
          command: bash .circleci/check_no_session_links.sh

  lint:
    executor: py
    steps:
      - checkout
      - restore_cache:
          keys:
            # pinned versions live in lint-requirements.txt; a bump changes the key
            - pip-lint-v3-{{ checksum ".circleci/lint-requirements.txt" }}
      - run:
          name: Install pinned lint tools (shellcheck-py ships the shellcheck binary, no apt)
          command: pip install --quiet -r .circleci/lint-requirements.txt
      - save_cache:
          key: pip-lint-v3-{{ checksum ".circleci/lint-requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: ruff (correctness gate, config in pyproject.toml)
          command: ruff check src tests scripts deploy reports notebooks
      - run:
          name: bandit (medium+ severity; LOW findings are not gated)
          command: bandit -q -ll -r src deploy scripts
      - run:
          name: yamllint
          command: yamllint -c .yamllint.yaml .
      - run:
          name: shellcheck (warning level, config in .shellcheckrc)
          command: git ls-files '*.sh' | grep -v '^vendor/' | xargs -r shellcheck -S warning
      - restore_cache:
          keys:
            - npm-v1
      - run:
          name: markdownlint (GFM, config in .markdownlint-cli2.yaml)
          # npm reuses downloaded packages; npx may still consult the registry.
          command: npx --yes markdownlint-cli2@0.18.1
      - save_cache:
          key: npm-v1
          paths:
            - ~/.npm

  checks:
    # Committed generated files must match their generators. All network-free;
    # pytest repeats the CLI-reference and runbook checks, this job fails first.
    executor: py
    steps:
      - checkout
      - venv
      - run:
          name: Reports hub committed snapshot
          command: python reports/dashboard/build_hub.py --check
      - run:
          name: Requirements mirror pyproject
          command: python scripts/sync_requirements.py --check
      - run:
          name: CLI reference matches the parser (docs/cli-reference.md)
          command: python scripts/check_cli_surface.py --check
      - run:
          name: Runbook catalog pins and generated docs/runbooks
          command: sandbox runbook check
      - run:
          name: Campaign report indexes (reports/campaigns/rb1)
          command: sandbox report build --campaign rb1 --check

  test:
    executor: py
    resource_class: medium
    parallelism: 4
    steps:
      - checkout
      - venv
      - run:
          name: Pytest (network-free; this container's share of the test files)
          # -n 2 matches medium's 2 vCPU / 4GB. junit_family=legacy writes the
          # `file` attribute CircleCI needs to split by timings. Set
          # SANDBOX_XDIST to override the worker count without editing CI.
          command: |
            mkdir -p test-results coverage-data
            circleci tests glob "tests/test_*.py" \
              | circleci tests split --split-by=timings > /tmp/test-files.txt
            # An empty share would make pytest fall back to the whole suite.
            test -s /tmp/test-files.txt
            echo "Files on container ${CIRCLE_NODE_INDEX}: $(wc -l < /tmp/test-files.txt)"
            COVERAGE_FILE="coverage-data/.coverage.${CIRCLE_NODE_INDEX}" \
              pytest -q -n "${SANDBOX_XDIST:-2}" --dist loadfile -m "not local_llm" \
                -o junit_family=legacy --junitxml="test-results/junit-${CIRCLE_NODE_INDEX}.xml" \
                --cov --cov-report= --cov-fail-under=0 --durations=10 \
                $(cat /tmp/test-files.txt)
      - store_test_results:
          # also on failure: the JUnit files feed the next run's timing split
          path: test-results
          when: always
      - store_artifacts:
          path: test-results
          when: always
      - persist_to_workspace:
          root: .
          paths:
            - coverage-data

  notebook-regressions:
    executor: py
    steps:
      - checkout
      - venv
      - run:
          name: Install notebook execution dependencies
          command: pip install --quiet nbclient nbformat ipykernel pandas matplotlib
      - run:
          name: Execute offline notebooks and their bootstrap regressions
          command: |
            pytest -q -n 0 --no-cov tests/test_notebook.py tests/test_notebooks.py tests/test_prep.py \
              --junitxml=test-results/notebooks.xml
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: test-results
          when: always

  coverage:
    executor: py
    steps:
      - checkout
      - venv
      - attach_workspace:
          at: .
      - run:
          name: Combine coverage from every test container and enforce fail_under
          command: |
            ls -A coverage-data/
            test "$(ls -A coverage-data | grep -c '^\.coverage\.')" -eq 4
            coverage combine coverage-data/
            coverage report
            coverage xml -o coverage/coverage.xml
      - store_artifacts:
          path: coverage

workflows:
  ci:
    jobs:
      - no-session-links
      - lint
      - checks
      - test
      - notebook-regressions
      - coverage:
          requires:
            - test
