# Extraction arm against ab-pipeline-governor-r3.
# Same 50 documents, routes, reviewer, seed and draw. Two differences, both
# aimed at the fields the repaired labels actually score:
#   - correspondence_specialist_condensed_v4 and contracts_specialist_condensed_v1,
#     the candidates written to the labeling guide (not yet adopted);
#   - job.schema_guide, so the schema descriptions for those repaired fields
#     follow the same guide.
# Labels are 9.3.1-rc.10. On these 50 documents rc.10 applies the same fields
# as rc.9 (287 fields, 18 hub overrides, 0 stale), so a score move is the
# prompts and the schema text, not a new label.
#
# The production quality bar stays 0.90. On the r3 answers, 0.80 still leaves
# 21 of 45 gated archives wrong. Insurance claim facts are already 1.0; the
# four insurance archives under 0.90 miss supporting_documents. Contracts sit
# at 0.60-0.82 on CUAD clauses, term length and agreement date. Correspondence
# sits at a median 0.56 on sender, recipients, action items and type.
#
# Launch (preflight does not spend):
#   sandbox run preflight --config config/runs/ab-pipeline-extended-labels.yaml
#   sandbox run start --config config/runs/ab-pipeline-extended-labels.yaml --initials <XX>

schema: sandbox.run/v1
run_id: ab-pipeline-extended-labels
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    contracts_specialist: {source: local, file: contracts_specialist_condensed_v1}
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v4}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 9}
      - {doc_class: corporate_record, count: 7}
      - {doc_class: correspondence, count: 15}
      - {doc_class: insurance_claim, count: 17}
      - {doc_class: merger_agreement, count: 2}
  sample_seed: 3302
  require_task_gt: true
  staged_overlay: 9.3.1-rc.10
  exclude_ids_file: config/production/excluded-ids.txt
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95}
    corporate_record: {high: 0.95}
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50
  max_wall_seconds: 7200
  api_cost_cap_usd: 2.00
  require_expanded_inputs: true
  blind_routing: true
  schema_guide: true
  governor:
    retries: 3

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, ab-pipeline, extended-labels]
