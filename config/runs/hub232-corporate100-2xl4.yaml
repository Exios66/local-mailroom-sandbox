# SPEND-GATED — do not run until Jack go
# Hub #232 — five-class scale n=100, 2×L4 L5 frozen (no serving-knob drift).
schema: sandbox.run/v1
run_id: hub232-corporate100-2xl4
task: corporate_records_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist:
      source: local
      file: corporate_records_specialist_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - {doc_class: corporate_record, count: 100}
  limit: 100
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 16
    enable_prefix_caching: true
    enforce_eager: false
    quantization: "awq_marlin"
    revision: ""
    kv_cache_dtype: "fp8"
    enable_thinking: false
    cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    max_inputs: 32
  modal:
    app: sandbox-vllm-hub232
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 2
    min_containers: 2
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 32
  cost_cap_usd: 1.0
  max_wall_seconds: 7200

trace:
  sink: none
  otlp: false
  environment: hub232
  tags: [sandbox, hub232, spend-gated, qwen3-8b, l4, corporate_record, n100]
