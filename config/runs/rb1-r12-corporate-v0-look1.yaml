# Evaluation runbook R12 (rb1 batch 1, SAND-108): specialists v0, the corporate lineage.
# corporate_records_specialist at its decided v0 stem corporate_records_specialist_condensed_v1 (plan decision 3, the lineage frontrunner) on
# qwen/qwen3.7-flash, on the 54 corporate_record documents of config/splits/runbook-v1 dev-look1.
# The five R12 configs together are the 300 dev-look1 documents, 300 calls (the rotation pool holds
# only correspondence and insurance, so it cannot exercise all five specialists; deviation logged).
# Settings equal runbook-r03-corporate-v0-dev (same prompt, knobs, handoff and subclass mode, schema_guide
# off), so its dev-look1 documents are a repeat measurement: field ICC = intraclass correlation of
# per-document extraction_f1 between this run and the R03 v0 pass on the same documents.
#
# Estimate is provisional: one call per document per reader; re-preflight after the API chunking
# default (job.chunking, auto = off on OpenRouter) lands. This config does not set job.chunking.
# Cost: 54 calls, about $0.040 list (scripts/estimate_spend.py method on the
# preflighted documents: config/api_prices.yaml tiers per call, 4 chars per token, the condensed sorter
# prompt or the pinned specialist prompt, 150 / 1,500 output tokens per sorter / specialist call).
# Caps: api_cost_cap_usd and cost_cap_usd $0.06 (~1.5x, at least $0.05), max_wall_seconds 3600.
# Launch only with the owner's initials at the spend gate, from the repository root (a worktree also
# needs PYTHONPATH=$PWD/src); the served-provider ledger must be set for the start, not only the preflight:
#   SANDBOX_SERVED_LOG=data/runtime/rb1-r12/served-rb1-r12-corporate-v0-look1.jsonl sandbox run preflight --config config/runs/rb1-r12-corporate-v0-look1.yaml && \
#   SANDBOX_SERVED_LOG=data/runtime/rb1-r12/served-rb1-r12-corporate-v0-look1.jsonl sandbox run start --config config/runs/rb1-r12-corporate-v0-look1.yaml --initials <XX>
schema: sandbox.run/v1
run_id: rb1-r12-corporate-v0-look1
task: corporate_records_specialist
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  draw: ranked
  require_task_gt: false
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  exclude_ids_file: config/splits/runbook-v1/dev-look1.exclude.ids
  strata:
    buckets:
      - {doc_class: corporate_record, count: 54}
  limit: 54
  interim_labels: true
  near_gold_labels: true

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_knobs:
  corporate_records_specialist: {max_input_chars: 700000}

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 12
  cost_cap_usd: 0.06
  max_wall_seconds: 3600
  api_cost_cap_usd: 0.06
  pipeline_handoff: true
  specialist_subclass: gold

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, runbook, rb1, R12, corporate-v0, dev-look1]
