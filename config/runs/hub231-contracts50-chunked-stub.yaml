# SPEND-GATED — do not run until Jack go
# Hub #231 — STUB: two-pass / chunked extraction for contracts.
# Harness gap: sandbox.run/v1 has no chunking or multi-pass flag — implement in
# mailroom_sandbox job layer before spend. This YAML pins dataset + frozen L5 only.
#
# Planned approach (document in hub #231 comment):
#   - Pass 1: outline / section map with lower max_tokens
#   - Pass 2: field fill per section
# Do NOT add unsupported engine keys here.
schema: sandbox.run/v1
run_id: hub231-contracts50-chunked-stub
task: contracts_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    contracts_specialist:
      source: local
      file: contracts_specialist_v33_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - {doc_class: contract, count: 50}
  limit: 50
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 16
    enable_prefix_caching: true
    enforce_eager: false
    quantization: "awq_marlin"
    revision: ""
    kv_cache_dtype: "fp8"
    enable_thinking: false
    cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    max_inputs: 32
  modal:
    app: sandbox-vllm-hub231
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 2
    min_containers: 2
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 32
  cost_cap_usd: 0.60
  max_wall_seconds: 5400

trace:
  sink: none
  otlp: false
  environment: hub231
  tags: [sandbox, hub231, spend-gated, stub, contract, chunked]

note: "NOT RUNNABLE for chunked experiment until harness supports multi-pass/chunking — YAML placeholder only."
