# Specialist extract: contracts_specialist on 30 MERGER_AGREEMENT docs.
# Same specialist as commercial contracts; separate strata/run for MAUD rows.
# Test split has only ~17 mergers — MUST use train (135 merger rows at pin).
#
# Efficient conservative Modal posture: 1×L4, max_containers=1, min_containers=0,
# scaledown 600s, job.concurrency=4.
#
#   sandbox run preflight --config config/runs/run-30-merger-specialist.yaml --live
#   sandbox run start --config config/runs/run-30-merger-specialist.yaml --job-mode endpoint --watch
schema: sandbox.run/v1
run_id: run-30-merger-specialist
task: contracts_specialist
profile: modal-vllm

prompt:
  # Pinned local production text (config/prompts/contracts_specialist_v33.txt) for reproducible
  # Modal L4 runs — not Langfuse floating production. Synced from vendored
  # llm-mailroom code-default (contracts_specialist).
  default: {source: code-default}
  agents:
    contracts_specialist:
      source: local
      file: contracts_specialist_v33

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  # split: train — test has only 17 merger_agreement rows; train has 135
  # (all_cash 51, other 49, all_stock 22, mixed_cash_stock 12,
  # mixed_cash_stock_election 1) at revision 46a4d3c2
  split: train
  revision: 46a4d3c240a36671cde0182fff4960f6b8b73aca   # pinned (FAMILY_HF_REVISION)
  strata:
    buckets:
      # merger_agreement: all 5 consideration types, proportional → 30 rows
      - doc_class: merger_agreement
        sub_buckets:
          - {subclass: all_cash, count: 11}                   # avail 51
          - {subclass: other, count: 11}                      # avail 49
          - {subclass: all_stock, count: 5}                   # avail 22
          - {subclass: mixed_cash_stock, count: 2}            # avail 12
          - {subclass: mixed_cash_stock_election, count: 1}   # avail 1
  limit: 30
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B
  vllm:
    max_model_len: 16384
    gpu_memory_utilization: 0.90
    max_num_seqs: 256
    quantization: ""
    revision: ""
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 600
    max_containers: 1
    min_containers: 0
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 4

trace:
  sink: none
  otlp: false
  environment: specialist-30
  tags: [sandbox, job, specialist, merger, qwen3-8b, l4, benchmark]
