# OpenRouter provider pins for the evaluation runbook (R01). Applied at activation by
# mailroom_sandbox.provider_pins to the vendored chat calls it wraps (agents.base / llm.retry
# retry_chat_completion) on an OpenRouter base URL; the LangChain contract / merger agents and
# modules that imported the function before activation are not covered.
# A non-empty `order` sends extra_body.provider = {order, allow_fallbacks}. Every call's
# served model and provider is recorded (SANDBOX_SERVED_LOG=<file> writes JSONL).
#
# `order: []` = not pinned yet (recorded only). Fill it from
#   python scripts/refresh_provider_pins.py            # lists each model's endpoints (public GET, no key)
# then run the R01 smoke test and require `status: verified` on every ledger row of every
# smoke model before R10+ (`mismatch: false` alone is not evidence).
# Decision models go through the Decisions API (decision_backends) and are pinned by
# their dated canonical slug in config/decision_models.yaml, not here.
models:
  qwen/qwen3.7-flash:
    order: []
    allow_fallbacks: false
  qwen/qwen3.5-9b:
    order: []
    allow_fallbacks: false
  deepseek/deepseek-v4.1-flash-1017:
    order: []
    allow_fallbacks: false
  z-ai/glm-5.3-flashx-legal:
    # design pins the dated slug and its reasoning effort
    canonical_slug: z-ai/glm-5.3-flashx-legal-20261102
    order: []
    allow_fallbacks: false
