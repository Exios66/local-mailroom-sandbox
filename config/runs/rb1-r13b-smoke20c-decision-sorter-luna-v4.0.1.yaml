# CHECKPOINT smoke 20c (H5): smoke20b's Luna arm again, unchanged (same 20 dev-look1 documents,
# question set 4.0.1, caps), now that decide() records the document_form answer's probabilities
# (document_form_probabilities, document_form_human_mass). Record-only: routing and scores are
# the SHF-009 contract as in 20b. Purpose: see whether 20b's 4 false form parks (DOC-be1e,
# DOC-52f9, DOC-0a73, DOC-b005) are low-confidence calls. Any floor is then set on the
# calibration split, never on these dev-look1 documents. The qwen arm is not rerun: compare
# against rb1-r13b-smoke20b-llm-sorter-qwen3.7-flash. Cost: ~$0.05 input-only. Caps $0.15, 1800 s.
#   SANDBOX_SERVED_LOG=data/runtime/rb1-r13b/served-luna-20c.jsonl .venv/bin/sandbox run preflight --config config/runs/rb1-r13b-smoke20c-decision-sorter-luna-v4.0.1.yaml
#   SANDBOX_SERVED_LOG=data/runtime/rb1-r13b/served-luna-20c.jsonl .venv/bin/sandbox run start --config config/runs/rb1-r13b-smoke20c-decision-sorter-luna-v4.0.1.yaml --initials <XX>
schema: sandbox.run/v1
run_id: rb1-r13b-smoke20c-decision-sorter-luna-v4.0.1
task: sorter_reviewer
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  draw: ranked
  require_task_gt: false
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  exclude_ids_file: config/splits/runbook-v1/dev-look1.exclude.ids
  strata:
    buckets:
      - {doc_class: contract, count: 4}
      - {doc_class: corporate_record, count: 4}
      - {doc_class: correspondence, count: 4}
      - {doc_class: insurance_claim, count: 4}
      - {doc_class: merger_agreement, count: 4}
  limit: 20
  sample_seed: 20261118
  interim_labels: true
  near_gold_labels: true

engine:
  kind: openrouter
  model: openai/gpt-6-luna-decisions
  modal: null

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v4.0.1

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 8
  cost_cap_usd: 0.15
  max_wall_seconds: 1800
  api_cost_cap_usd: 0.15

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, runbook, R13b, H5, smoke20c, v4.0.1, form-probabilities, decisions-api, decision-sorter, dev-look1]
