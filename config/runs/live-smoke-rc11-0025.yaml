# Live behaviour smoke, 25 documents: the production slice-0100 configuration on the rc.11 labels with
# every landed opt-in switched on. Every agent, judge, boss and arbiter included, runs qwen/qwen3.7-flash.
# The 100-document step-up is live-smoke-rc11-0100.yaml; same seed, ranked draw and exclude list, so
# these 25 documents are a subset of it (and of production slice-0100).
#
# Differences from config/runs/production/slice-0100.yaml:
#   - labels: staged_overlay 9.3.1-rc.11 (near-gold corporate subclass fields, reviewed subclass and
#     primary-type corrections since rc.10; 0 unscorable corporate records on slice 100);
#   - supervisors: judge, boss and arbiter routed explicitly to qwen/qwen3.7-flash (a stronger tier such as
#     deepseek/deepseek-v4-pro comes only after the flash failure points are fixed);
#   - job.subclass_field_note (#443), job.schema_guide, judge.mode verify (HF-025), governor retries 3,
#     the merger switches and job.long_document_head (HF-030/HF-032/HF-033, #449);
#   - confidence block from p5-s2-merger-reads (merger judge off; HF-030 honours 0).
# The Luna Decisions reviewer stays the sorter_reviewer only: it is the one decision slot with
# calibrated thresholds (reviewer_decisions_v2). No other decision slot is switched on.
#
# Launch (a human supplies the initials):
#   sandbox run preflight --config config/runs/live-smoke-rc11-0025.yaml --live
#   sandbox run start --config config/runs/live-smoke-rc11-0025.yaml --initials <XX>
#   sandbox run gate --run-id live-smoke-rc11-0025 --thresholds

schema: sandbox.run/v1
run_id: live-smoke-rc11-0025
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v3}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 5}
      - {doc_class: corporate_record, count: 4}
      - {doc_class: correspondence, count: 7}
      - {doc_class: insurance_claim, count: 8}
      - {doc_class: merger_agreement, count: 1}
  sample_seed: 3302
  require_task_gt: true
  task_gt_min_field_labels: 2
  staged_overlay: 9.3.1-rc.11
  exclude_ids_file: config/production/excluded-ids.txt
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}
  arbiter: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    corporate_record: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    correspondence: {judge_max_passes: 2, arbiter_retry_max: 1}
    insurance_claim: {judge_max_passes: 2, arbiter_retry_max: 1}
    merger_agreement: {judge_max_passes: 0, arbiter_retry_max: 0}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

judge:
  mode: verify

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 4             # JobSpec default; #441 (cap race) is open, so at most 4 calls can pass the cap
  cost_cap_usd: 0.50         # GPU cap field (validation requires one); OpenRouter spend is capped below
  max_wall_seconds: 3600
  api_cost_cap_usd: 0.75
  require_expanded_inputs: true
  blind_routing: true
  schema_guide: true
  subclass_field_note: true
  governor:
    retries: 3
  merger: {subclass_fields: true, question_groups: true, gap_retry: true}
  long_document_head: true

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, rc11, live-smoke, smoke-0025]
