# api-evals: correspondence_specialist on 20 CORRESPONDENCE docs via OpenRouter API.
# COMPARABLE to the sandbox Modal specialist runs: the SAME draw
# (split=all, bucket correspondence count 20, seed 42, pinned revision) and the
# SAME prompt — both legs now resolve the lineage frontrunner at preflight
# (correspondence_specialist_condensed_v3 today); the historical simplified-stem
# pairs stay recorded in the run store. Only the engine differs:
# profile=openrouter, model qwen/qwen3.7-flash (the OpenRouter champion that
# maps to the Modal Qwen/Qwen3-8B row). Real API costs are captured per item
# (tokens x OpenRouter list price; cross-checked vs response usage.cost).
schema: sandbox.run/v1
run_id: api-correspondence-20
task: correspondence_specialist
profile: openrouter

prompt:
  # No explicit agent stem: preflight fills the agent's lineage frontrunner
  # (prompt_lineage.with_lineage_defaults), so this harness always runs the
  # current condensed prompt and can never silently regress to a superseded
  # stem. Today that is correspondence_specialist_condensed_v3; the frozen
  # simplified-stem pairs (and the Modal legs they compared against) remain
  # recorded in the run store and reports history.
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ed7576b676343e0b402ec5412cded301e629bdee   # pinned (FAMILY_HF_REVISION)
  strata:
    buckets:
      - doc_class: correspondence
        count: 20
  limit: 20
  sample_seed: 42

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  vllm:
    max_model_len: 16384
    gpu_memory_utilization: 0.90
    max_num_seqs: 256
    quantization: ""
    revision: ""

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 5
  cost_cap_usd: null
  max_wall_seconds: 3600

trace:
  sink: none
  otlp: false
  environment: api-evals
  tags: [sandbox, job, api-evals, specialist, correspondence, openrouter, qwen3.7-flash]
