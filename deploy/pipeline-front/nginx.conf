worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  upstream vllm_backends {
    least_conn;
    zone vllm_backends 64k;
    server host.docker.internal:18000 max_conns=6;
    server host.docker.internal:18001 max_conns=6;
    server host.docker.internal:18002 max_conns=6;
    server host.docker.internal:18003 max_conns=6;
    server host.docker.internal:18004 max_conns=6;
  }

  server {
    listen 8000;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://vllm_backends;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
