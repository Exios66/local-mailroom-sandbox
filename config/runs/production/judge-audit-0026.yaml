# Judge audit arm (llm-mailroom #278): does the judge catch the wrong archives the router never sends it?
# In production-slice-0100-r2 every contract was judged (high 0.95 puts it in the band), but 34 of the
# 36 corporate/correspondence/insurance wrong archives reported confidence >= 0.95 and skipped the judge.
# TREATMENT (the only change from slice-0100): judge_band_high 1.01 on those three classes, so every
# archivable extraction is judged. Diagnostic, not an adoption candidate (the ladder's E2 judge-all
# treatment for corporate records was rejected on cost).
#
# Sample: the ranked-draw prefix of slice-0100 (same seed, revision and exclusions; draws nest), so every
# document pairs with r2: 6 corporate, 10 correspondence, 10 insurance. No contracts (already judged)
# and no mergers (about 570k tokens a document, not gated).
#
# Read-out: sandbox run gate --run-id judge-audit-0026 --prev-run-id production-slice-0100-r2, then
# per document: judge verdict vs gate outcome. Success = the judge rejects most wrong archives and few
# correct ones; failure (judge passes wrong archives) means routing on the judge cannot fix the gate.
# api_cost_cap_usd 0.75: about 2x r2's measured spend for these classes plus one judge call a document.
#
# Launch (a human supplies the initials; never launch from an agent):
#   sandbox run preflight --config config/runs/production/judge-audit-0026.yaml
#   sandbox run start --config config/runs/production/judge-audit-0026.yaml --initials <XX>

schema: sandbox.run/v1
run_id: judge-audit-0026
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}   # sorter: vendored sorter_condensed_v5 (the adopted frontrunner)
  agents:   # adopted condensed frontrunners (config/prompts/specialist_condensed_lineage.yaml)
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v3}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  strata:
    buckets:
      - {doc_class: corporate_record, count: 6}
      - {doc_class: correspondence, count: 10}
      - {doc_class: insurance_claim, count: 10}
  sample_seed: 3302          # one seed for every slice, so the draws nest
  require_task_gt: true     # every document can be scored
  interim_labels: true      # gap-fill labels for unlabelled fields (data/labels/interim; Dojo #164)
  near_gold_labels: true  # fill fields still unlabelled with Claude near-gold labels (data/labels/gold-overlay; status near_gold)
  exclude_ids_file: config/production/excluded-ids.txt   # tuning documents, dropped before the draw
  draw: ranked   # exclusion-stable order: adding tuning ids keeps the rest of every slice

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95}
    corporate_record: {high: 0.95, judge_band_high: 1.01}   # TREATMENT: judge every extraction
    correspondence: {judge_band_high: 1.01}                 # TREATMENT
    insurance_claim: {judge_band_high: 1.01}                # TREATMENT
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50         # GPU cap field (validation requires one); OpenRouter spend is capped below
  max_wall_seconds: 3600
  api_cost_cap_usd: 0.75
  blind_routing: true       # no dataset labels in the graph's state (llm-mailroom #207)

trace:
  sink: none          # no Docker: spans still mirror to data/traces/<run_id>.spans.jsonl.gz
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, judge-audit, llm-mailroom-278]
