# Routing/recall ladder step E3: E1 + E2 + judge every contract, so a self-reported 1.0 retry no longer archives unjudged.
# Run only after E1/E2; keep whichever single change helped. Success: no class below r2 and contract >= E1.
# Base: pipeline-qwen-flash-25-fit-r2 (same 25 documents, models, reviewer, caps).
# Compare: sandbox run routing --run-id pipeline-qwen-flash-25-e3-chunk-judge-all; per-class numbers vs r2 (see docs/audits ladder).
schema: sandbox.run/v1
run_id: pipeline-qwen-flash-25-e3-chunk-judge-all
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  strata:
    buckets:
      - {doc_class: contract, count: 5}
      - {doc_class: merger_agreement, count: 5}
      - {doc_class: corporate_record, count: 5}
      - {doc_class: correspondence, count: 5}
      - {doc_class: insurance_claim, count: 5}
  limit: 25
  sample_seed: 42
  require_task_gt: true   # every document can be scored

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}
  contracts_specialist: {max_input_chars: 18000}   # E1: baseline contract window -> ~3 chunks

confidence:
  by_class:
    contract: {high: 0.95, judge_band_high: 1.01}   # E3: judge every contract, retries included
    corporate_record: {high: 0.95, judge_band_high: 1.01}   # E2: judge every corporate extraction
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50
  max_wall_seconds: 7200
  api_cost_cap_usd: 1.25   # 2.5x the 10-doc smoke ceiling; priced at the dearest model tier

trace:
  sink: none          # no Docker: spans still mirror to data/traces/<run_id>.spans.jsonl.gz;
                      # compact afterwards with `sandbox traces pack` (zstd Parquet zip)
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, n25, context-fit, routing-calibration, ladder-e3]
