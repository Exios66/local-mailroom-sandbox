schema: sandbox.run/v1
run_id: ar-mailroom-v1-r01-merger-agreement-deepseek-v4.1-flash
task: pipeline
profile: openrouter
prompt:
  default:
    source: code-default
  agents:
    corporate_records_specialist:
      source: local
      file: corporate_records_specialist_condensed_v1
    correspondence_specialist:
      source: local
      file: correspondence_specialist_condensed_v3
    insurance_claims_specialist:
      source: local
      file: insurance_claims_specialist_condensed_v3
dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  strata:
    buckets:
    - doc_class: contract
      count: 5
    - doc_class: corporate_record
      count: 5
    - doc_class: correspondence
      count: 5
    - doc_class: insurance_claim
      count: 5
    - doc_class: merger_agreement
      count: 5
  sample_seed: 3302
  require_task_gt: true
  interim_labels: true
  exclude_ids_file: config/production/excluded-ids.txt
  draw: ranked
engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null
agent_routes:
  judge:
    provider: openrouter
    model: qwen/qwen3.7-flash
  boss:
    provider: openrouter
    model: qwen/qwen3.7-flash
agent_knobs:
  sorter:
    max_input_chars: 600000
  intake:
    max_input_chars: 600000
confidence:
  by_class:
    contract:
      high: 0.95
    corporate_record:
      high: 0.95
    merger_agreement:
      arbiter_retry_max: 1
      judge_max_passes: 2
job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.5
  max_wall_seconds: 3600
  api_cost_cap_usd: 1.0
  blind_routing: true
trace:
  sink: none
  environment: pilot
  tags:
  - sandbox
  - pipeline
  - openrouter
  - qwen3.7-flash
  - chat-reviewer
  - autoresearch
  - mailroom-v1
  - lever:merger-agreement-deepseek-v4.1-flash
agent_models:
  merger_agreement_specialist: deepseek/deepseek-v4.1-flash-1017
