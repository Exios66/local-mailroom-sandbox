# Clean repeat of pipeline-qwen-flash-25-fit. That run shared catalog matter ids with
# the baseline, so 14/25 documents met their own earlier archive as a matter conflict
# and took a Boss ruling instead of the judge. Matter ids are now run-scoped.
#
# Rerun of pipeline-qwen-flash-25 after PR #298: same documents (seed 42, same Hub
# revision), same models and reviewer. What differs: context fit (default on) sizes
# specialists/judge/arbiter to Qwen3.7 Flash's 1M window, and the run-scoped
# `confidence` block below drops the classification bar the sorter never reaches
# (max 0.95) and shortens the merger escalation loop. Compare with
#   sandbox run routing --run-id pipeline-qwen-flash-25-fit-r2
#
# (Baseline header follows.)
# Full-pipeline usability/effectiveness check over OpenRouter: Qwen3.7 Flash on every
# agent node (sorter, intake, specialists, judge, boss, arbiter), 25 documents, 5 per
# primary class, on the current family dataset pin (FAMILY_HF_REVISION).
# The decision reviewer stays the calibrated Decisions-API model (input-only billing,
# no chat route) with the reviewer-calibration-luna-decisions-v2 cutoffs; see
# pipeline-luna-decisions-qwen-smoke.yaml for the 10-document precursor.
# Metrics land in the run directory (results, metrics, lock); spans go to the local
# gzipped mirror (trace.sink none). Replay afterwards with
#   sandbox floor --run pipeline-qwen-flash-25
schema: sandbox.run/v1
run_id: pipeline-qwen-flash-25-fit-r2
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  strata:
    buckets:
      - {doc_class: contract, count: 5}
      - {doc_class: merger_agreement, count: 5}
      - {doc_class: corporate_record, count: 5}
      - {doc_class: correspondence, count: 5}
      - {doc_class: insurance_claim, count: 5}
  limit: 25
  sample_seed: 42
  require_task_gt: true   # every document can be scored

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95}
    corporate_record: {high: 0.95}
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50
  max_wall_seconds: 7200
  api_cost_cap_usd: 1.25   # 2.5x the 10-doc smoke ceiling; priced at the dearest model tier

trace:
  sink: none          # no Docker: spans still mirror to data/traces/<run_id>.spans.jsonl.gz;
                      # compact afterwards with `sandbox traces pack` (zstd Parquet zip)
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, n25, context-fit, routing-calibration]
