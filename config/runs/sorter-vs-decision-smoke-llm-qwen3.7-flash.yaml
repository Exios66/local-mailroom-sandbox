# Smoke for the LLM sorter on Qwen 3.7 Flash, the model used by the earlier sorter runs.
# Paired with config/runs/sorter-vs-decision-smoke-decision-luna.yaml.
# One document per class, same seed, revision, exclusion list, staged labels and
# ranked draw as that decision smoke, so both arms classify the same five documents.
#
# Model: qwen/qwen3.7-flash on OpenRouter (1,000,000 input tokens), pinned to Alibaba.
# No max_input_chars knob: context fit opens the classify window, and
# require_expanded_inputs refuses a run that stays at 12k characters.
# The 32k-token tier is $0.10 / $0.40 per 1M. Five documents at that tier are
# about $0.05. The cap is $1.
#
# Results stay on this machine (trace.sink: none). A human supplies the initials:
#   sandbox run preflight --config config/runs/sorter-vs-decision-smoke-llm-qwen3.7-flash.yaml
#   sandbox run start --config config/runs/sorter-vs-decision-smoke-llm-qwen3.7-flash.yaml --initials <XX>
schema: sandbox.run/v1
run_id: sorter-vs-decision-smoke-llm-qwen3.7-flash
task: isolated
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 1}
      - {doc_class: corporate_record, count: 1}
      - {doc_class: correspondence, count: 1}
      - {doc_class: insurance_claim, count: 1}
      - {doc_class: merger_agreement, count: 1}
  sample_seed: 3302
  require_task_gt: true
  staged_overlay: 9.3.1-rc.9
  exclude_ids_file: config/production/excluded-ids.txt
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 5
  cost_cap_usd: 0.50
  max_wall_seconds: 1200
  api_cost_cap_usd: 1
  require_expanded_inputs: true

trace:
  sink: none
  environment: pilot
  tags: [sandbox, sorter-vs-decision, llm-sorter, qwen3.7-flash, openrouter, smoke]
