# Operator runbook catalog (SAND-031)
#
# THIS IS THE EDIT SURFACE. After changing this file:
#   sandbox runbook check    # catalog vs live pins (deploy / models.yaml / run YAMLs)
#   sandbox runbook write    # regenerate docs/runbooks/*.md
#   sandbox runbook show <id>
#
# Do NOT copy serving numbers into markdown by hand. Per-class concurrency,
# cost caps, and prompt stems stay in specialist_posture.py and are rendered
# live. Suite order stays in config/runs/suites/*.yaml.
schema: sandbox.runbook/v1
catalog_id: sandbox-operator-runbooks
title: Sandbox Modal + vLLM operator runbooks

how_to_edit: |
  1. Change serving pins, variants, or a runbook's steps / configs here.
  2. Run `sandbox runbook check` — it must stay green against deploy defaults,
     config/models.yaml, and the cited run YAMLs.
  3. Run `sandbox runbook write` so docs/runbooks/ matches the renderer.
  4. Commit the catalog + generated docs together.

ops:
  app: sandbox-vllm
  profile: modal-vllm
  job_mode: endpoint
  teardown: ./deploy/teardown_vllm.sh
  prewarm: modal run deploy/modal_vllm.py::download_model
  deploy: modal deploy deploy/modal_vllm.py
  gpu_usd_per_hour: 0.80
  scaledown_unattended: 600
  track_a_profile_env: SANDBOX_MODAL_PROFILE_TRACK_A
  track_a_profile_default: hermes-agent-jjb
  track_b_profile_env: SANDBOX_MODAL_PROFILE_TRACK_B
  dataset_repo: Lucius-Morningstar/mailroom-dataset
  sample_seed: 42
  never:
    - Share one Modal token / ~/.modal.toml profile across operators
    - Tear down or modal deploy --strategy recreate between classes on one track
    - Set MODAL_VLLM_GPU=L4:2 + TP for Qwen3-8B (use MAX_CONTAINERS=2 instead)
    - Edit run-30-*-specialist.yaml for a one-off model swap

serving:
  # Singular L4, one container, Qwen3-8B — the default cost-eval posture.
  # Must match deploy/modal_vllm.py defaults + models.yaml + run-30 YAML engine.
  baseline:
    model: Qwen/Qwen3-8B
    gpu: L4
    image_tag: v0.29.0
    max_model_len: 16384
    max_num_seqs: 6
    gpu_memory_utilization: "0.90"
    enable_prefix_caching: 1
    enforce_eager: 1
    max_containers: 1
    min_containers: 0
    scaledown_seconds: 120
    quantization: ""
    tp_size: 1
  variants:
    awq-16k:
      model: Qwen/Qwen3-8B-AWQ
      quantization: awq
      max_model_len: 16384
    awq-32k:
      model: Qwen/Qwen3-8B-AWQ
      quantization: awq
      max_model_len: 32768
    awq-14b-a100:
      model: Qwen/Qwen3-14B-AWQ
      gpu: A100-40GB
      quantization: awq_marlin
      max_model_len: 32768
      max_num_seqs: 32
      gpu_memory_utilization: "0.90"
      enable_prefix_caching: 1
      enforce_eager: 0
      max_containers: 1
      min_containers: 1
      scaledown_seconds: 600
      extra_env:
        MODAL_VLLM_KV_CACHE_DTYPE: fp8
        MODAL_VLLM_CUDAGRAPH_CAPTURE_SIZES: "1,2,4,8,16,32"
        MODAL_VLLM_DEFAULT_CHAT_TEMPLATE_KWARGS: '{"enable_thinking": false}'
        PHOENIX_TRACING: disabled
        SANDBOX_AGENT_KNOBS: '{"sorter":{"max_tokens":2048,"max_input_chars":12000}}'
    granite-fp8:
      model: ibm-granite/granite-4.2-8b-fp8
      quantization: compressed-tensors
      max_model_len: 32768
      extra_env:
        # v0.29.0 has no `granite_thinking_parser` (KeyError boot crash) — the
        # native `granite` parser is the verified pin. No tool parser: the
        # specialist extract path uses no tool calls.
        MODAL_VLLM_REASONING_PARSER: granite
    second-l4-dp:
      max_containers: 2
    scale-short-doc:
      max_num_seqs: 256
      scaledown_seconds: 600
    # SAND-037 specialist grid shapes. Must equal `sandbox run deploy-env` for
    # every config in the grid-1l4 / grid-2l4 runbooks (one engine block per shape).
    grid-awq-1l4:
      model: Qwen/Qwen3-8B-AWQ
      quantization: awq
      max_model_len: 32768
      max_num_seqs: 8
      enforce_eager: 1
      max_containers: 1
      min_containers: 1
      extra_env:
        MODAL_VLLM_DEFAULT_CHAT_TEMPLATE_KWARGS: '{"enable_thinking": false}'
        MODAL_VLLM_MAX_INPUTS: "8"
        PHOENIX_TRACING: disabled
    grid-awq-2l4:
      model: Qwen/Qwen3-8B-AWQ
      quantization: awq
      max_model_len: 32768
      max_num_seqs: 16
      enforce_eager: 0
      max_containers: 2
      min_containers: 2
      extra_env:
        MODAL_VLLM_KV_CACHE_DTYPE: fp8
        MODAL_VLLM_CUDAGRAPH_CAPTURE_SIZES: "1,2,4,8,16"
        MODAL_VLLM_DEFAULT_CHAT_TEMPLATE_KWARGS: '{"enable_thinking": false}'
        MODAL_VLLM_MAX_INPUTS: "32"
        PHOENIX_TRACING: disabled

