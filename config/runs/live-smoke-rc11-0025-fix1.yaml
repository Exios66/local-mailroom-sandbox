# Fix arm 1 against live-smoke-rc11-0025: the same 25 documents, seed, draw, labels (rc.11), routes,
# switches and caps. Three prompt changes, each confined to one class, so the per-class comparison is paired:
#   - correspondence_specialist_condensed_v5 (v4 + the labeling guide's top-message contact rule): the smoke
#     had 7/7 correspondence wrong archives, 3 of them on sender/recipient read from quoted mail;
#   - contracts_specialist_condensed_v1 (the candidate written to the repaired contract schema): the smoke had
#     4/5 contract wrong archives, with agreement_date null twice and 23 CUAD clauses missed;
#   - corporate_records_specialist_condensed_v2 (the guide's effective_date fallback to the adoption or filing
#     date): the smoke's one corporate wrong archive left effective_date null on a charter amendment that takes
#     effect on filing and is signed with its date.
# Code fix in the same checkout: the shared-inbox document name is unique per row (eval/runners._inbox_name),
# so same-named Enron messages cannot overwrite each other; archives read <mailbox>_<folder>_<n>__<id>.txt.
# Everything else is live-smoke-rc11-0025 (see that file's header).
#
# Launch (a human supplies the initials):
#   sandbox run preflight --config config/runs/live-smoke-rc11-0025-fix1.yaml --live --initials <XX>
#   sandbox run start --config config/runs/live-smoke-rc11-0025-fix1.yaml --initials <XX>
#   sandbox run gate --run-id live-smoke-rc11-0025-fix1 --thresholds

schema: sandbox.run/v1
run_id: live-smoke-rc11-0025-fix1
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    contracts_specialist: {source: local, file: contracts_specialist_condensed_v1}
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v2}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v5}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 5}
      - {doc_class: corporate_record, count: 4}
      - {doc_class: correspondence, count: 7}
      - {doc_class: insurance_claim, count: 8}
      - {doc_class: merger_agreement, count: 1}
  sample_seed: 3302
  require_task_gt: true
  task_gt_min_field_labels: 2
  staged_overlay: 9.3.1-rc.11
  exclude_ids_file: config/production/excluded-ids.txt
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}
  arbiter: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    corporate_record: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    correspondence: {judge_max_passes: 2, arbiter_retry_max: 1}
    insurance_claim: {judge_max_passes: 2, arbiter_retry_max: 1}
    merger_agreement: {judge_max_passes: 0, arbiter_retry_max: 0}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

judge:
  mode: verify

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 4             # JobSpec default; #441 (cap race) is open, so at most 4 calls can pass the cap
  cost_cap_usd: 0.50         # GPU cap field (validation requires one); OpenRouter spend is capped below
  max_wall_seconds: 3600
  api_cost_cap_usd: 0.75
  require_expanded_inputs: true
  blind_routing: true
  schema_guide: true
  subclass_field_note: true
  governor:
    retries: 3
  merger: {subclass_fields: true, question_groups: true, gap_retry: true}
  long_document_head: true

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, rc11, live-smoke, smoke-0025, fix1]
