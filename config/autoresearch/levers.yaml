  # ---- pipeline source: the insurance repair branch (llm-mailroom PR 283) ----
  # Runs the round with MAILROOM_SRC pointing at a checkout of the declared commit; the loop refuses a checkout at any other
  # commit. Never proposed unless AUTORESEARCH_PR283_SRC names that checkout. The vendored tree is not touched.
- id: repair-283
  node: insurance_claims_specialist
  classes: [insurance_claim]
  description: Pipeline source with the insurance extraction repairs (llm-mailroom PR 283, commit 090991b3).
  pipeline_source: {env: AUTORESEARCH_PR283_SRC, commit: 090991b34c0e4e56658a1c38f98c9d9fc414b0d4}


# Per-role placement: after a lever of `group` is kept, derive `<winner>@<roles>` cost levers that keep the winner on
# only those roles and put the others back on the base spec's routing. Judged by `goal: cost` (not worse, and <= 0.9x cost).
placements:
  - group: supervisor
    roles: [judge, arbiter, boss]
    keep_on: [[judge], [arbiter], [boss], [judge, arbiter], [judge, boss], [arbiter, boss]]
    path: agent_routes.{role}
