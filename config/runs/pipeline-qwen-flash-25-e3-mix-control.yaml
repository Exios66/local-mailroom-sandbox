# Ladder E3 control. Combined regression check on held-out documents: r2 settings (control) vs E1+E2+judge every contract.
# Sample: 45 documents, 10 each of contract/corporate/correspondence/insurance plus 5 mergers (the
# changes do not touch mergers; 5 keeps the cost down). Holdout seed 2026, unseen by E1/E2 tuning.
# Only run after E1 and E2; drop any treatment change that lost its own step.
# Success: no class below control by more than 0.03; contract and corporate improve.
# Model (held fixed across the ladder, so the only variable is the marked line): qwen/qwen3.7-flash on
# OpenRouter for every agent node; decision reviewer openai/gpt-6-luna-decisions with the v2 cutoffs.
# Every E2/E3 arm (not a treatment): blind routing, interim labels and the adopted condensed
# specialist prompts (docs/audits/2026-11-16-pre-e2-architecture-review.md).
# Plan: docs/audits/2026-11-15-contract-recall-routing-ladder.md. Base: pipeline-qwen-flash-25-fit-r2.
schema: sandbox.run/v1
run_id: pipeline-qwen-flash-25-e3-mix-control
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}   # sorter: vendored sorter_condensed_v5 (the adopted frontrunner)
  agents:   # adopted condensed frontrunners (config/prompts/specialist_condensed_lineage.yaml)
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v2}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  strata:
    buckets:
      - {doc_class: contract, count: 10}
      - {doc_class: corporate_record, count: 10}
      - {doc_class: correspondence, count: 10}
      - {doc_class: insurance_claim, count: 10}
      - {doc_class: merger_agreement, count: 5}
  limit: 45
  sample_seed: 2026
  require_task_gt: true   # every document can be scored
  interim_labels: true    # gap-fill labels for unlabelled fields (data/labels/interim; Dojo #164)

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95}
    corporate_record: {high: 0.95}
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50
  max_wall_seconds: 7200
  api_cost_cap_usd: 1.75   # ~2x the r2-derived estimate for this sample, dearest-tier pricing
  blind_routing: true     # no dataset labels in the graph's state (llm-mailroom #207)

trace:
  sink: none          # no Docker: spans still mirror to data/traces/<run_id>.spans.jsonl.gz;
                      # compact afterwards with `sandbox traces pack` (zstd Parquet zip)
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, n25, context-fit, routing-calibration, ladder-e3-mix-control]
