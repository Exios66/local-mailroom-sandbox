# Local-first overlay applied on top of mailroom's shipped taxonomy.yaml.
# Profile rewrite sets every agent's provider/model first. Agent keys listed
# here (temperature, max_tokens, max_input_chars, reasoning_effort, and an
# optional model) win after that rewrite. CLI --agent-model wins last.

vision:
  enabled: true
  models:
    - "qwen/"
    - "qwen3"
    - "llava"
    - "llama-3.2"
    - "gpt-4o"
    - "gemini"
    - "claude"

# SAND-077: keep the vendored champion → served-id remap in sync with
# config/models.yaml (the default vLLM model is Qwen/Qwen3.5-9B). The other
# vendored rows (deepseek → R1 distills) are unchanged.
vllm_model_map:
  qwen/qwen3.7-flash: Qwen/Qwen3.5-9B
  openrouter/free: Qwen/Qwen3.5-9B

cost_models:
  qwen3:8b:
    input_per_million: 0.0
    output_per_million: 0.0
  qwen3:7b:
    input_per_million: 0.0
    output_per_million: 0.0
  Qwen/Qwen3-8B:
    input_per_million: 0.0
    output_per_million: 0.0
  Qwen/Qwen3.5-9B:
    input_per_million: 0.0
    output_per_million: 0.0
  llama3.1:8b:
    input_per_million: 0.0
    output_per_million: 0.0
  deepseek-r1:8b:
    input_per_million: 0.0
    output_per_million: 0.0

# Context fit (sandbox): the agents.* budgets below are sized for a 16k-token L4
# window. On a long-context API route (providers), the listed agents instead get
# (context_length - max_tokens - reserve_tokens) * chars_per_token, using the
# model's context_length in config/api_prices.yaml. The chunk cap rises with
# them, so a document is chunked only when it exceeds the model's real window.
# The judge/arbiter source excerpts follow the fitted judge/arbiter budgets
# (mailroom_sandbox.source_windows). Modal/vLLM/Ollama routes are unchanged.
# The sorter, sorter_reviewer and intake are fitted too: the vendored sorter and
# intake slide windows over the whole document at their budget, so an unfitted
# 12k budget read a 380k-char merger in ~100 calls (rb1 R01 smoke). On an API
# route every reader makes one call per document that fits the model.
# Run agent_knobs still win.
context_fit:
  enabled: true
  chars_per_token: 2.4
  reserve_tokens: 8000
  providers: [openrouter]
  agents: [specialists, judge, arbiter, sorter, sorter_reviewer, intake]
  # A fitted specialist writes the whole document's extraction in one reply, so its output cap
  # rises too (within the model's max_completion_tokens; never on Modal/local routes, never over
  # a run max_tokens knob). The 2-4k L4 caps below cut long JSON off and forced re-extractions.
  output_tokens: 16384

# Retry budgets (one retry per lane, not two). Before this block a document could run up to
# four extractions, three judge passes and two arbiter calls before parking it for a person
# (retry_max 1 from config/components.yaml, arbiter_retry_max 2, judge_max_passes 3, two
# node-level transient re-runs on top of retry_chat_completion's own five attempts). These
# apply to every provider route. A run's `confidence` block and a locked run's frozen block
# still win; a lock with no frozen effective_confidence resumes on its earlier budgets
# (routing_audit.legacy_thresholds), so HF-011 and HF-012 stay inert there.
confidence:
  retry_max: 1                    # one confidence/schema re-extraction (classify retries once anyway)
  arbiter_retry_max: 1            # one arbiter fix-list re-extraction
  judge_max_passes: 2             # = 1 + arbiter_retry_max: every arbiter retry is judged once
  transient_retry_max: 1          # HF-012: node re-runs after a transient provider error
  judge_exhausted_to_arbiter: true  # HF-011: a partial last pass gets the arbiter's final ruling
  # HF-014: on a context-fitted route (arbiter window widened, e.g. OpenRouter) an arbiter
  # acceptance from a whole-source reading archives with its caveats. Inert on Modal/vLLM and local routes (16k excerpts).
  arbiter_full_source: true

# DMR-072: run-level limits — 900s was too high for idle; 600s holds L4
# saturation bursts (queue + decode under concurrency 4–5). The vendored
# 120s default cannot hold an L4 generation at all — the pin belongs HERE
# (overlay), not in the drift-guarded vendored file.
run_limits:
  llm_call_timeout_seconds: 600
  # Per document. A 233k-character contract passed 22k at retry_classify, so 20000 aborted it.
  max_total_output_tokens: 200000

# Surgical knobs — overlay wins after profile rewrite. Omit `model` to keep
# the mapped local tag from the active profile.
# DMR-078: specialist max_tokens / max_input_chars from specialist_posture
# (fit Qwen/Qwen3-8B on L4 max_model_len=16384; short docs avoid over-prefill).
agents:
  sorter:
    temperature: 0.1
    max_tokens: 2048
    max_input_chars: 12000
    reasoning_effort: "none"
  sorter_reviewer:
    temperature: 0.1
    max_tokens: 2048
    max_input_chars: 12000
    reasoning_effort: "none"
  arbiter:
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 100000
    reasoning_effort: "none"
  contracts_specialist:
    temperature: 0.1
    # SAND-018: 4096 decode (2048 truncated contract JSON). Input cap sized for
    # the measured ~2.4 chars/token of dense filings AND the ~3100-token v33
    # prompt overhead: 18000 chars ≈ 7500 tokens + 4096 decode + 4000 reserve
    # ≤ 16384. (35000 chars = 14337 tokens, 24000 = 12289 — both 400 the 16k
    # window; raising the window to 32k for AWQ is the follow-up to restore it.)
    max_tokens: 4096
    max_input_chars: 18000
    reasoning_effort: "none"
  merger_agreement_specialist:
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 36008
    reasoning_effort: "none"
  corporate_records_specialist:
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 21875
    reasoning_effort: "none"
  correspondence_specialist:
    temperature: 0.1
    max_tokens: 2048
    max_input_chars: 15312
    reasoning_effort: "none"
  insurance_claims_specialist:
    temperature: 0.1
    max_tokens: 3072
    max_input_chars: 19687
    reasoning_effort: "none"
  reporter:
    temperature: 0.2
    max_tokens: 3072
    max_input_chars: 40000
    reasoning_effort: "none"
  boss:
    temperature: 0.1
    max_tokens: 8192
    max_input_chars: 40000
    reasoning_effort: "none"
  pdf_transcriber:
    temperature: 0.1
    max_tokens: 8192
    max_input_chars: 40000
    reasoning_effort: "none"
  image_extractor:
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 20000
    reasoning_effort: "none"
  judge:
    temperature: 0.0
    max_tokens: 4096
    max_input_chars: 80000
    reasoning_effort: "none"
