# Full pipeline over OpenRouter: Qwen3.7 Flash on every node, with OpenAI Luna as
# the decision reviewer on the three classes whose cutoffs met the 95% target in the
# 735-document calibration pilot (reports/reviewer-calibration/reviewer-calibration-luna.json).
# contract and corporate_record are left out, so they keep the LLM reviewer: Luna files
# registration-rights agreements and indentures (corporate records) as contracts at
# 0.94-0.99 confidence, so no contract cutoff reaches 95%, and corporate_record's
# 0.86 cutoff scored 98.5% but its lower bound (94.7%) misses the target.
# Provisional for issue #208 until the full 1,888-document calibration confirms them.
schema: sandbox.run/v1
run_id: pipeline-luna-qwen-smoke
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: train
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - doc_class: contract
        count: 2
        sub_buckets:
          - {subclass: "License_Agreements", count: 1}
          - {subclass: "Maintenance", count: 1}
      - doc_class: merger_agreement
        count: 2
        sub_buckets:
          - {subclass: "all_cash", count: 1}
          - {subclass: "other", count: 1}
      - doc_class: corporate_record
        count: 2
        sub_buckets:
          - {subclass: "articles_of_incorporation", count: 1}
          - {subclass: "charter_amendment", count: 1}
      - doc_class: correspondence
        count: 2
        sub_buckets:
          - {subclass: "email", count: 1}
          - {subclass: "notice", count: 1}
      - doc_class: insurance_claim
        count: 2
        sub_buckets:
          - {subclass: "auto", count: 1}
          - {subclass: "property", count: 1}
  limit: 10
  sample_seed: 42
  require_task_gt: true   # every document can be scored

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  sorter_reviewer: {provider: openrouter, model: openai/gpt-6-luna}
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

reviewer:
  backend: api
  model: openai/gpt-6-luna
  classes:
    merger_agreement: 0.98
    correspondence: 0.71
    insurance_claim: 0.61

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 2
  cost_cap_usd: 0.50
  max_wall_seconds: 2400
  api_cost_cap_usd: 0.50   # the ceiling prices every token at Luna; Qwen bills about a third

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, decision-reviewer]
