# Full-pipeline A/B, arm B: correcting judge, loop governor off.
# Pair: config/runs/ab-pipeline-governor.yaml (today's judge, governor on).
# Same documents and production setup as that arm. This arm changes only the judge:
# mode correct, qwen/qwen3.7-plus, mergers on deepseek/deepseek-v4.1-flash-1017,
# no reference examples. The governor stays off so the comparison is the two levers.
#
# api_cost_cap_usd 6.84: 1.5 x (50 x $0.02 + 2 rulings x $0.03, mergers x $0.17).
# 48 non-mergers and 2 mergers; every drawn document is counted as judged.
# Launch:
#   sandbox run preflight --config config/runs/ab-pipeline-correcting-judge.yaml
#   sandbox run start --config config/runs/ab-pipeline-correcting-judge.yaml --initials <XX>

schema: sandbox.run/v1
run_id: ab-pipeline-correcting-judge
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v3}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 9}
      - {doc_class: corporate_record, count: 7}
      - {doc_class: correspondence, count: 15}
      - {doc_class: insurance_claim, count: 17}
      - {doc_class: merger_agreement, count: 2}
  sample_seed: 3302
  require_task_gt: true
  staged_overlay: 9.3.1-rc.9
  exclude_ids_file: config/production/excluded-ids.txt
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95}
    corporate_record: {high: 0.95}
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

judge:
  mode: correct
  model: qwen/qwen3.7-plus
  models_by_class:
    merger_agreement: deepseek/deepseek-v4.1-flash-1017
  references: "off"

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50
  max_wall_seconds: 7200
  api_cost_cap_usd: 6.84
  require_expanded_inputs: true
  blind_routing: true

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, ab-pipeline, correcting-judge]
