# Held-out half of the rc.11 100-document ranked draw. Same seed and production
# exclusions as slice-0100, plus the 50 ids of live-smoke-rc11-0050, so none of the
# smoke documents are redrawn. Strata are the complement of that 50 inside the 100
# (insurance 16, merger 3; the other classes keep the smoke counts). These documents
# were not used to set contract low or the caveat-park classes.
#
# Launch:
#   sandbox run preflight --config config/runs/live-smoke-rc11-heldout50.yaml --live
#   sandbox run start --config config/runs/live-smoke-rc11-heldout50.yaml --initials <XX>
#   sandbox run gate --run-id live-smoke-rc11-heldout50 --thresholds

schema: sandbox.run/v1
run_id: live-smoke-rc11-heldout50
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    contracts_specialist: {source: local, file: contracts_specialist_condensed_v1}
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v2}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v6}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 9}
      - {doc_class: corporate_record, count: 7}
      - {doc_class: correspondence, count: 15}
      - {doc_class: insurance_claim, count: 16}
      - {doc_class: merger_agreement, count: 3}
  sample_seed: 3302
  require_task_gt: true
  task_gt_min_field_labels: 2
  staged_overlay: 9.3.1-rc.11
  exclude_ids_file: config/runs/live-smoke-rc11-heldout50.exclude.txt
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}
  arbiter: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

# Calibrated on the two 25-document smokes (live-smoke-rc11-0025, -0025-fix1); the 25 documents this draw
# adds are their held-out check. flash self-reports only 0, 0.85, 0.95 or 1.0:
#   - contract low 0.90 -> 0.85: contracts_specialist_condensed_v1 reports 0.85 on 3 of 5 contracts at the
#     same quality as 0.95 (first attempts 0.61-0.88), so the pre-judge retry it triggered was noise;
#   - caveat_acceptance_parks (HF-034) on contract, correspondence and insurance_claim: 14 of their 15
#     arbiter accept_with_caveats archives scored under 0.90 (corporate records' 3 were right, so they keep
#     archiving). Those documents park for review instead of archiving silently wrong.
confidence:
  by_class:
    contract: {high: 0.95, low: 0.85, judge_max_passes: 2, arbiter_retry_max: 1, caveat_acceptance_parks: true}
    corporate_record: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    correspondence: {judge_max_passes: 2, arbiter_retry_max: 1, caveat_acceptance_parks: true}
    insurance_claim: {judge_max_passes: 2, arbiter_retry_max: 1, caveat_acceptance_parks: true}
    merger_agreement: {judge_max_passes: 0, arbiter_retry_max: 0}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

judge:
  mode: verify

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 4             # JobSpec default; #441 (cap race) is open, so at most 4 calls can pass the cap
  cost_cap_usd: 0.50         # GPU cap field (validation requires one); OpenRouter spend is capped below
  max_wall_seconds: 7200
  api_cost_cap_usd: 1.0
  require_expanded_inputs: true
  blind_routing: true
  schema_guide: true
  subclass_field_note: true
  governor:
    retries: 3
  merger: {subclass_fields: true, question_groups: true, gap_retry: true}
  long_document_head: true

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, rc11, live-smoke, heldout50, fix2, calib1]
