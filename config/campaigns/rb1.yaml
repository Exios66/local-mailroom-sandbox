# Campaign rb1 (runbook-v1): the evaluation runbook, phases 0-9, rows R00..R90.
#
# Read by src/mailroom_sandbox/report_campaigns.py. Built once from the runbook CSV
# (experiment_runbook.csv, kept outside the repo); only the row IDs, phases and a short
# paraphrased title are copied here. The naming grammar lives in reports/campaigns/README.md:
#
#   experiment key   <campaign>-<row>          rb1-r01
#   experiment dir   <key>-<slug>              rb1-r01-provider-pin-smoke
#   run_id           <key>-<rest>              rb1-r01-smoke-qwen3.7-flash
#   iteration        iNN                       i01
#   artifact         <run_id>-<iNN>.<name>.<ext>
#
# A run belongs to the experiment whose key prefixes its run_id; its committed config is
# config/runs/<run_id>.yaml. Gate rows (gN) and analysis-only rows have no runs of their own.
schema: sandbox.campaign/v1
campaign: rb1
name: runbook-v1
title: Evaluation runbook v1
experiments:
  - {row: r00, slug: splits-freeze, phase: "0 Setup", title: "Build and freeze splits and subclass families; leak and length audit"}
  - {row: r01, slug: provider-pin-smoke, phase: "0 Setup", title: "Pin slugs and providers; 10-doc smoke per model"}
  - {row: r02, slug: scorer-handcheck, phase: "0 Setup", title: "Scoring harness hand-check (F1, cost-weighted error, Brier/ECE, null floors)"}
  - {row: r03, slug: gold-audit, phase: "0 Setup", title: "Gold-label audit of v0-vs-gold disagreements per lineage"}
  - {row: g0, slug: checkpoint, phase: "0 Setup", title: "Phase 0 checkpoint (QC, review, stop)"}
  - {row: r10, slug: pilot-repeatability, phase: "1 Pilot", title: "Merged into R14 (temperature-0 arm repeats)"}
  - {row: r11, slug: sorter-v0-1, phase: "1 Pilot", title: "Sorter v0.1, one small edit"}
  - {row: r12, slug: specialists-v0, phase: "1 Pilot", title: "Specialists v0"}
  - {row: r13, slug: decision-routing, phase: "1 Pilot", title: "Decision models in the routing role"}
  - {row: r14, slug: decoding-sweep, phase: "1 Pilot", title: "Decoding sweep (temperature grid)"}
  - {row: r15, slug: input-cap-sweep, phase: "1 Pilot", title: "Sorter input-cap sweep"}
  - {row: g1, slug: checkpoint, phase: "1 Pilot", title: "Phase 1 checkpoint; re-run sizing with measured values"}
  - {row: r20, slug: sorter-v0-baselines, phase: "2 Model screen", title: "Sorter v0 baselines and iteration floor"}
  - {row: g2, slug: checkpoint, phase: "2 Model screen", title: "Phase 2 checkpoint"}
  - {row: r30, slug: sorter-iteration, phase: "3 Sorter iteration", title: "Sorter-condensed iteration on the iteration model"}
