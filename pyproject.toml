[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom-sandbox"
version = "0.1.0"
description = "Local-first experiment sandbox for the LLM-Mailroom pipeline (Ollama, vLLM, llama.cpp)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "pydantic>=2.0",
    "openai>=1.30",
    # Current family scoring pin (llm-dojo-scoring v0.11.0). The v0.5.0
    # mailroom *tag* still asks for v0.7.0, so mailroom is not a core pip dep —
    # use `sandbox fetch-deps` (source tree @ v0.5.0) or the `[pipeline]` extra
    # (mailroom main; matching dojo pin once mailroom lands @v0.11.0).
    "llm-dojo-scoring @ git+https://github.com/Exios66/llm-dojo-scoring.git@v0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
observability = [
    "langfuse>=4.0,<5",
]
deploy = [
    "modal>=0.73",
]
# Current llm-mailroom main. Conflicts with the v0.5.0 tag. Mailroom's
# pyproject still listed dojo v0.10.0 until its matching @v0.11.0 pin lands;
# v0.11.0 is additive on v0.10.0 (formulas / T0 names unchanged).
pipeline = [
    "mailroom @ git+https://github.com/Exios66/llm-mailroom.git",
]
evals = [
    "llm-entity-extraction @ git+https://github.com/Exios66/llm-entity-extraction.git@v0.20.0",
]
gpu = [
    "mailroom-sandbox[deploy]",
]
all = [
    "mailroom-sandbox[dev,deploy,evals,observability]",
]

[project.scripts]
sandbox = "mailroom_sandbox.cli:main"
mailroom-sandbox = "mailroom_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mailroom_sandbox*"]

[tool.setuptools.package-data]
mailroom_sandbox = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "local_llm: live test against a local OpenAI-compatible server (skipped unless SANDBOX_LOCAL_LLM=1)",
]
