# Qwen3-8B-AWQ specialist grid cell (v1 / simplified stem).
# Keep GPU warm (min_containers pinned); teardown only after the shape queue.
# 1xL4 c=8; 2xL4 c=32 (16 per replica). PHOENIX_TRACING=disabled at launch.
# Decode 8192 via start-time SANDBOX_AGENT_KNOBS (clears 4096 LengthFinish JSON).
schema: sandbox.run/v1
run_id: grid-50-contracts-specialist-awq-1l4
task: contracts_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    contracts_specialist:
      source: local
      file: contracts_specialist_v33_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - {doc_class: contract, count: 50}
  limit: 50
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 8
    enable_prefix_caching: true
    enforce_eager: true
    quantization: awq
    revision: ""
    enable_thinking: false
    max_inputs: 8   # never 0 — MAX_INPUTS=0 serialized contracts-50 at Running:1
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 1
    min_containers: 1
    prewarm: true
job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 8
  cost_cap_usd: 0.8
  max_wall_seconds: 4800

trace:
  sink: none
  otlp: false
  environment: qwen-grid
  tags: [sandbox, job, specialist, qwen3-8b-awq, l4, grid]
