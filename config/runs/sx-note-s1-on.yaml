# Subclass field note A/B, the "on" arm: config/runs/p4-s1-verify-gov-off.yaml with job.subclass_field_note on.
# Plan: docs/design/plans/2026-11-27-subclass-field-note.md
#
# Same documents, prompts, routes, knobs, labels and caps as the Phase 4 stage 1 baseline; the only
# change is the note after each specialist's promoted prompt naming the fields its subclass schema
# does not request and the ones it adds. The baseline run is the "off" arm; if it has already run,
# it need not be repeated. api_cost_cap_usd 9.0 as the baseline: the note adds a few hundred prompt
# tokens per extraction call.
#
# Labels: the rc.10 staged overlay. Pull it first (GitHub access, no spend):
#   python scripts/pull_staged_overlay.py --version 9.3.1-rc.10
# Launch (a human supplies the initials; never launch from an agent):
#   sandbox run preflight --config config/runs/sx-note-s1-on.yaml
#   sandbox run start --config config/runs/sx-note-s1-on.yaml --initials <XX>
# Compare: sandbox run gate on both runs, then the paired per-class and per-field deltas
# (gate_compare) on the same document ids; merger maud_clauses is the field to watch.

schema: sandbox.run/v1
run_id: sx-note-s1-on
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v3}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 84}
      - {doc_class: corporate_record, count: 56}
      - {doc_class: correspondence, count: 66}
      - {doc_class: insurance_claim, count: 74}
      - {doc_class: merger_agreement, count: 20}
  limit: 300
  sample_seed: 3302
  require_task_gt: true
  staged_overlay: 9.3.1-rc.10
  exclude_ids_file: config/splits/runbook-v2/dev-look1.exclude.ids   # every document outside dev-look1
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    corporate_record: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    correspondence: {judge_max_passes: 2, arbiter_retry_max: 1}
    insurance_claim: {judge_max_passes: 2, arbiter_retry_max: 1}
    merger_agreement: {judge_max_passes: 2, arbiter_retry_max: 1}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

judge:
  mode: verify               # today's judge, plus the per-ruling record (HF-025)

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50         # GPU cap field (validation requires one); OpenRouter spend is capped below
  max_wall_seconds: 10800
  api_cost_cap_usd: 9.0
  require_expanded_inputs: true
  blind_routing: true
  subclass_field_note: true

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, phase4, stage-1, judge-verify, subclass-field-note]
