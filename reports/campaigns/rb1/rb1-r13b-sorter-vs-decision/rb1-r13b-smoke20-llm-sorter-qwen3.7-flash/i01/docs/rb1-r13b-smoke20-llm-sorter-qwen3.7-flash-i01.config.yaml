# Stage 1 of 3 of the H5 sorter head-to-head (SAND-108). The two smoke20 configs share this exact
# dataset block (dev-look1, 4 docs per class, sample_seed 20261118), so they draw the same 20 documents
# and pair one to one. Purpose: prove the mechanics (pairing, one request per document, cost
# accounting, abstention/routing columns, report folders) before dev-look1 (300) and dev (600/900).
# Launch ONE arm at a time, LLM arm first, from the repository root with the owner's initials.
#
# Arm A: LLM sorter, prompt code-default (lineage frontrunner sorter_condensed_v5) on qwen/qwen3.7-flash.
# Whole document in one request (API route, no windowing; preflight's context_plan must show 1 window).
# Cost: ~0.6M input tokens at $0.03/M plus small output, about $0.03. Caps $0.15, 1800 s.
#   SANDBOX_SERVED_LOG=data/runtime/rb1-r13b/served-qwen3.7-flash.jsonl sandbox run preflight --config config/runs/rb1-r13b-smoke20-llm-sorter-qwen3.7-flash.yaml
#   SANDBOX_SERVED_LOG=data/runtime/rb1-r13b/served-qwen3.7-flash.jsonl sandbox run start --config config/runs/rb1-r13b-smoke20-llm-sorter-qwen3.7-flash.yaml --initials <XX>
# Readout (offline, after both arms):
#   python scripts/compare_sorter_arms.py --a rb1-r13b-smoke20-llm-sorter-qwen3.7-flash --b rb1-r13b-smoke20-decision-sorter-luna --experiment-key rb1-r13b --write
schema: sandbox.run/v1
run_id: rb1-r13b-smoke20-llm-sorter-qwen3.7-flash
task: isolated
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  draw: ranked
  require_task_gt: false
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  exclude_ids_file: config/splits/runbook-v1/dev-look1.exclude.ids
  strata:
    buckets:
      - {doc_class: contract, count: 4}
      - {doc_class: corporate_record, count: 4}
      - {doc_class: correspondence, count: 4}
      - {doc_class: insurance_claim, count: 4}
      - {doc_class: merger_agreement, count: 4}
  limit: 20
  sample_seed: 20261118
  interim_labels: true
  near_gold_labels: true

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_knobs:
  sorter: {max_input_chars: 600000}

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 8
  cost_cap_usd: 0.15
  max_wall_seconds: 1800
  api_cost_cap_usd: 0.15

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, runbook, R13b, H5, smoke20, llm-sorter, dev-look1]
