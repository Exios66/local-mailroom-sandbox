# Autoresearch champion for the mailroom-v1 study: the production slice-gate configuration with a
# smaller draw and the CHAT reviewer, at the production sampling temperatures (production comparability wins over
# determinism; run-to-run noise is measured by the replicate baseline instead).
#
# Derived from config/runs/production/slice-0100.yaml. Every setting below is inherited from that
# file unchanged, so a lever's effect is measured against what production runs (the report's
# "Production parity" section lists the same table and checks it with `parity.compare`):
#
#   setting                        inherited value                              source
#   -----------------------------  -------------------------------------------  -----------------------------------------
#   profile / task                 openrouter / pipeline                        slice-0100.yaml
#   prompt.default                 code-default (vendored sorter_condensed_v5)  slice-0100.yaml
#   prompt.agents (3 specialists)  corporate v1, correspondence v3, insurance v3
#                                                                               config/prompts/specialist_condensed_lineage.yaml
#   dataset provider/repo/config   huggingface Lucius-Morningstar/mailroom-dataset ground_truth, split all
#   dataset.revision               bc9eab280044befb51e19dda3071d290a8677f42     slice-0100.yaml
#   dataset.sample_seed / draw     3302 / ranked                                slice-0100.yaml
#   dataset.require_task_gt        true                                         slice-0100.yaml
#   dataset.interim_labels         true (data/labels/interim gap-fill labels)   slice-0100.yaml
#   dataset.exclude_ids_file       config/production/excluded-ids.txt           slice-0100.yaml
#   engine                         openrouter qwen/qwen3.7-flash                slice-0100.yaml
#   agent_routes                   judge, boss on openrouter qwen/qwen3.7-flash slice-0100.yaml
#   agent_knobs                    sorter, intake max_input_chars 600000        slice-0100.yaml
#   confidence.by_class            contract high .95; corporate_record high .95;
#                                  merger_agreement arbiter_retry_max 1, judge_max_passes 2
#                                                                               slice-0100.yaml
#   job.mode / max_retries         endpoint / 1                                 slice-0100.yaml
#   job.fail_fast / concurrency    false / 10                                   slice-0100.yaml
#   job.cost_cap_usd               0.50 (GPU cap field, required by validation) slice-0100.yaml
#   job.blind_routing              true (no labels in the graph state)          slice-0100.yaml
#   trace                          sink none, environment pilot                 slice-0100.yaml
#   quality bars                   config/production/bars.yaml                  read by `sandbox run gate`, not by the spec
#   pipeline and Dojo sources      vendor/llm-mailroom, vendor/llm-dojo-scoring the vendored snapshots (VENDOR.md commits)
#
# Pipeline source: the vendored snapshot (vendor/llm-mailroom, the v0.30.0 branch tip f83e398, the same commit
# production slice-0100 runs). The unmerged llm-mailroom #283 repairs are NOT in the baseline: they are the opt-in
# `repair-283` lever (levers.yaml; needs AUTORESEARCH_PR283_SRC).
#
# Differences from slice-0100.yaml (the only ones; the report lists them again, computed):
#   dataset.strata        5 documents per class (25) instead of 18/14/30/33/5 (100). The ranked draw nests, so
#                         the first 5 per class are a subset of the production slice's order.
#   reviewer              OMITTED. The champion's reviewer is the CHAT reviewer: the taxonomy's
#                         `default_mode: llm` runs the sorter_reviewer chat agent on this run's route (Qwen flash).
#                         `reviewer: {backend: local}` cannot express that on OpenRouter (preflight refuses it: it
#                         needs a model other than the sorter's, an agent_routes.sorter_reviewer entry and an
#                         in-house route). Candidate reviewers are Decisions-API models only (levers.yaml, group reviewer).
#   (sampling)            no temperature override anywhere: every agent samples at its production temperature, so the
#                         baseline is comparable with a production slice. The study re-runs this spec once (the
#                         replicate) and keeps a lever only above the measured noise floor.
#   job.max_wall_seconds,
#   job.api_cost_cap_usd  set per round from the study file (budget.round_wall_seconds, budget.round_api_cap_usd).
#   job.mock              false (a paid study), set by the study's base run.
#   trace.tags            + autoresearch, the study name, lever:<id> (stamped per round).
#   run_id                ar-<study>-r<NN>-<lever id> (stamped per round).
schema: sandbox.run/v1
run_id: ar-mailroom-v1-base
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v3}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  strata:
    buckets:
      - {doc_class: contract, count: 5}
      - {doc_class: corporate_record, count: 5}
      - {doc_class: correspondence, count: 5}
      - {doc_class: insurance_claim, count: 5}
      - {doc_class: merger_agreement, count: 5}
  sample_seed: 3302
  require_task_gt: true
  interim_labels: true
  exclude_ids_file: config/production/excluded-ids.txt
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95}
    corporate_record: {high: 0.95}
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2}

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50
  max_wall_seconds: 3600
  api_cost_cap_usd: 1
  blind_routing: true

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, chat-reviewer, autoresearch]
