# Qwen3-8B-AWQ specialist grid cell (v1 / simplified stem) — SAND-037 n=20 2×L4 cell.
# Single-class seed-42 bucket on split=all, so this draw nests inside grid-50 correspondence.
# 2xL4 c=32 (16 per replica), fp8 KV, CUDA graphs, thinking off, max_inputs 32.
# Decode 8192 via start-time SANDBOX_AGENT_KNOBS (specialist_posture grid row).
# Runbook: sandbox runbook show grid-2l4
schema: sandbox.run/v1
run_id: grid-20-correspondence-specialist-awq-2l4
task: correspondence_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    correspondence_specialist:
      source: local
      file: correspondence_specialist_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - {doc_class: correspondence, count: 20}   # single class bucket → nested 20 ⊂ 50
  limit: 20
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 16
    enable_prefix_caching: true
    enforce_eager: false
    quantization: awq
    revision: ""
    kv_cache_dtype: "fp8"
    enable_thinking: false
    cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    max_inputs: 32
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 2
    min_containers: 2
    prewarm: true
job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 32
  cost_cap_usd: 0.4
  max_wall_seconds: 2400

trace:
  sink: none
  otlp: false
  environment: qwen-grid
  tags: [sandbox, job, specialist, qwen3-8b-awq, l4, grid]
