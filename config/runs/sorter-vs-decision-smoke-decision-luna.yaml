# Smoke for the decision-model sorter arm, before the 500-document run.
# Paired with config/runs/sorter-vs-decision-smoke-llm-deepseek-v4.1-flash.yaml.
# The dataset block matches that file, so both arms classify the same five documents.
#
# Same Decisions model, question set 4.1.0 and 2,328,000-character window as
# config/runs/sorter-vs-decision-500-decision-luna.yaml. Cap is $2.
# Five documents at the 1M-token peak are about $0.50.
#
# Launch after the LLM smoke. A human supplies the initials:
#   sandbox run preflight --config config/runs/sorter-vs-decision-smoke-decision-luna.yaml
#   sandbox run start --config config/runs/sorter-vs-decision-smoke-decision-luna.yaml --initials <XX>
# Readout, after both smokes finish:
#   python scripts/compare_sorter_arms.py --a sorter-vs-decision-smoke-llm-deepseek-v4.1-flash --b sorter-vs-decision-smoke-decision-luna
schema: sandbox.run/v1
run_id: sorter-vs-decision-smoke-decision-luna
task: sorter_reviewer
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 1}
      - {doc_class: corporate_record, count: 1}
      - {doc_class: correspondence, count: 1}
      - {doc_class: insurance_claim, count: 1}
      - {doc_class: merger_agreement, count: 1}
  sample_seed: 3302
  require_task_gt: true
  staged_overlay: 9.3.1-rc.9
  exclude_ids_file: config/production/excluded-ids.txt
  draw: ranked

engine:
  kind: openrouter
  model: openai/gpt-6-luna-decisions
  modal: null

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v4.1.0
  max_input_chars: 2328000

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 5
  cost_cap_usd: 0.50
  max_wall_seconds: 1200
  api_cost_cap_usd: 2

trace:
  sink: none
  environment: pilot
  tags: [sandbox, sorter-vs-decision, decision-sorter, luna-decisions, openrouter, smoke]
