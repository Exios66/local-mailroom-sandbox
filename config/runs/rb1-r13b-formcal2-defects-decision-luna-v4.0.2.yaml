# rb1 R13b document-form calibration DRAW 2, defects built from the draw-2 intact rows (H5).
# Fragments and bundles built by scripts/rb1_form_floor.py (cuts land in an email's newest message,
# never its quoted history; a closing window that opens its own instrument is skipped), so the
# correct document_form is known by construction. Read by `rb1_form_floor.py fit`, never as H5
# accuracy (bundle class labels are placeholders).
# Question set 4.0.2. Draw 2 is paired: the same rows run under 4.0.1 and 4.0.2 (4.0.2 was written from
# 14 draw-1 documents, so draw 1 is in-sample for it). Sibling: rb1-r13b-formcal2-intact-decision-luna-v4.0.1.
# Order (one run at a time): intact 4.0.1, intact 4.0.2, build the defects (offline), defects 4.0.1,
# defects 4.0.2, then fit each question set:
#   .venv/bin/python scripts/rb1_form_floor.py fit --intact-run data/runtime/runs/rb1-r13b-formcal2-intact-decision-luna-v<V> --defects-run data/runtime/runs/rb1-r13b-formcal2-defects-decision-luna-v<V> --defects data/runtime/rb1-r13b/formcal2-defects.jsonl
# Cost: about $0.10 input-only. Caps $0.40, 1800 s.
#   SANDBOX_SERVED_LOG=data/runtime/rb1-r13b/served-luna-formcal2.jsonl .venv/bin/sandbox run preflight --config config/runs/rb1-r13b-formcal2-defects-decision-luna-v4.0.2.yaml
#   SANDBOX_SERVED_LOG=data/runtime/rb1-r13b/served-luna-formcal2.jsonl .venv/bin/sandbox run start --config config/runs/rb1-r13b-formcal2-defects-decision-luna-v4.0.2.yaml --initials <XX>
schema: sandbox.run/v1
run_id: rb1-r13b-formcal2-defects-decision-luna-v4.0.2
task: sorter_reviewer
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: file
  local_path: data/runtime/rb1-r13b/formcal2-defects.jsonl
  config: ground_truth
  split: all

engine:
  kind: openrouter
  model: openai/gpt-6-luna-decisions
  modal: null

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v4.0.2

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 8
  cost_cap_usd: 0.40
  max_wall_seconds: 1800
  api_cost_cap_usd: 0.40
trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, runbook, R13b, H5, form-floor, defects, v4.0.2, draw2, decisions-api, decision-sorter, calibration]
