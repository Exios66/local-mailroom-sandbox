# Grant-parity Modal ladder — contracts + correspondence, N=20/40 × 1–2 L4.
# Pattern: run-30-specialists-track-a.yaml (ordered configs, one warm app).
#
# YAML-only PR — do not auto-run / --execute. HARD HOLD until explicit go
# (see docs/grant-parity-ladder.md). Zero Modal deploy / download / GPU spend
# from merging this file.
#
# One warm sandbox-vllm app through the full ladder. Do not tear down /
# redeploy / stop between cells. Teardown ONLY after the last:
#   ./deploy/teardown_vllm.sh
#
# Auth: MODAL_TOKEN_ID + MODAL_TOKEN_SECRET (Hermes profile is NOT required).
# For the full ladder, deploy with MODAL_VLLM_MAX_CONTAINERS=2 so 2×L4 cells
# can scale; 1×L4 YAMLs still pin max_containers: 1 as the intended replica
# cap for those cells. Expect higher $/hr on 2×L4 until scaledown.
#
# Estimate (no GPU): sandbox metrics estimate-suite --suite grant-parity-contracts-correspondence
# Print loop only:   sandbox run suite --suite grant-parity-contracts-correspondence
#                    # do NOT add --execute until explicit go
schema: sandbox.suite/v1
suite_id: grant-parity-contracts-correspondence
track: grant-parity
title: "Grant parity — contracts + correspondence N=20/40 × 1–2 L4"
rationale: |
  Grant ladder cells for contracts_specialist and correspondence_specialist
  on the FULL Hub corpus (split: all = train+test; no validation split).
  At FAMILY_HF_REVISION / Hub tip 46a4d3c2: contract=600, correspondence=1000.
  Test-only sampling is rejected — Hub 90/10 is an eval partition and test
  is subclass-unbalanced. Strata are Hamilton-proportional to full-corpus
  subclass availability (9 largest CUAD families; 7 largest correspondence
  types). Recommended order: N=20 1×L4, N=20 2×L4, N=40 1×L4, N=40 2×L4,
  contracts then correspondence inside each band. Jack lock c=8 on contracts;
  correspondence stays posture c=5.
scaledown_seconds: 120
warm_once: true
configs:
  - config/runs/run-20-contracts-specialist-modal.yaml
  - config/runs/run-20-correspondence-specialist-modal.yaml
  - config/runs/run-20-contracts-specialist-modal-2xl4.yaml
  - config/runs/run-20-correspondence-specialist-modal-2xl4.yaml
  - config/runs/run-40-contracts-specialist-modal.yaml
  - config/runs/run-40-correspondence-specialist-modal.yaml
  - config/runs/run-40-contracts-specialist-modal-2xl4.yaml
  - config/runs/run-40-correspondence-specialist-modal-2xl4.yaml
