# Production slice gate bars (docs/superpowers/specs/2026-11-16-production-slice-gate-design.md).
# Pass rule, pooled over the gated classes: wrong-archive rate <= wrong_archive_max, review rate
# <= review_max, 0 run errors, 0 judge_error. A correct archive scores >= quality on the labelled
# fields. merger_agreement is reported but never gated. Per-class bars apply only from a slice of
# per_class_from_n documents (counted over the whole slice, every class); below that they are
# diagnostic. Crashes and judge_error count slice-wide, merger_agreement included: they are harness
# faults, not quality. Rates use the gated classes only. A gated pool with archives but none
# scorable fails ("no scorable archives"); an unscorable share above 25% only warns. From
# per_class_from_n, a gated class with fewer than min_scorable_per_class scorable archives fails: its
# per-class rates would not be evidence (corporate records are mostly unscorable, llm-dojo-scoring#164).
quality: 0.90
wrong_archive_max: 0.02
review_max: 0.05
gated: [contract, corporate_record, correspondence, insurance_claim]
min_labelled: 2
per_class_from_n: 500
min_scorable_per_class: 20
