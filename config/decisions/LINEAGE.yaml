# Lineage of the decision reviewer question sets (family: reviewer_decisions).
# Model for every version: openai/gpt-6-luna-decisions (OpenRouter Decisions API).
# candidate_models are other Decisions-API ids (config/decision_models.yaml) a run may test a
# version on; none has a calibration yet, so none replaces `model` without one.
# Versions are semantic: MAJOR changes the request shape or the routing contract, MINOR adds
# or rewrites rules without changing the shape, PATCH fixes wording. A run locks the file's
# content and sha256, so a published version's file is never edited; a change is a new version.
family: reviewer_decisions
model: openai/gpt-6-luna-decisions
candidate_models:
  - id: typesafe/jev-1.14
    canonical_slug: typesafe/jev-1.14-20261014
    context_length: 262144
    note: >-
      Evaluation runbook R01 candidate (SAND-108). 262k context is below 4.0.0's
      max_input_chars (about 250k tokens for the largest document), so the largest documents
      need truncation_notice or a smaller window on this model. Uncalibrated.
frontrunner: 3.1.0
versions:
  - version: 1.0.0
    file: reviewer_decisions_v1.yaml
    parent: null
    status: superseded
    summary: doc_type plus one pick-one subclass question per class; state is the document.
    runs:
      - {run: reviewer-calibration-luna-decisions, split: train, documents: 735, class_accuracy: 0.9837, subclass_accuracy: 0.7801}
  - version: 2.0.0
    file: reviewer_decisions_v2.yaml
    parent: 1.0.0
    status: superseded
    summary: >-
      FNOL forms, subsidiary tables and merger transaction agreements fixed; contract title
      rule; correspondence subclasses as yes/no marker questions with the corpus precedence
      applied in code.
    runs:
      - {run: reviewer-calibration-luna-decisions-v2, split: train, documents: 735, class_accuracy: 1.0, subclass_accuracy: 0.8259}
      - {run: reviewer-validation-luna-decisions-v2-test, split: test, documents: 323, class_accuracy: 0.9845, routed_unattended: 0.9845, misrouted: 1}
      - {run: pipeline-luna-decisions-qwen-smoke, split: train, documents: 10, class_accuracy: 1.0}
  - version: 3.0.0
    file: reviewer_decisions_v3.0.0.yaml
    parent: 2.0.0
    status: superseded
    summary: >-
      Sorter handoff in the state and a verdict question (continue, correct subclass,
      reclassify, and human-review edge cases); compact criteria to cut per-document tokens.
    runs:
      - {run: reviewer-validation-luna-decisions-v3.0.0-test, split: test, documents: 323, class_accuracy: 0.9845, subclass_accuracy: 0.8142, routed_to_human_review_at_v2_cutoffs: 23, misrouted: 1, measured_cost_usd: 0.1905}
    findings: >-
      Class accuracy as v2 on test; subclass 263/323 vs v2 265. The verdict question does not
      follow the model's own doc_type answer: with the sorter's class wrong (14 documents) it
      answered continue_sorter_correct 10 times, and with only the subclass wrong (135) it
      answered continue 125 times. 4 of 9 human verdicts were email forwards called
      multiple_documents. 6 of the 14 subclass flips from v2 copy the sorter's wrong subclass.
  - version: 3.1.0
    file: reviewer_decisions_v3.1.0.yaml
    parent: 3.0.0
    status: frontrunner
    summary: >-
      insurance_claim subclasses cover the whole taxonomy (liability, health, life,
      workers_comp, other); a forward inside an email is not multiple_documents.
    runs:
      - {run: reviewer-verify-sorter-handoff-train, split: train, documents: 46, purpose: settle disputed handoff targets, input_tokens: 535592}
    scoring: >-
      Scored against the verified targets of the saved Qwen pass
      (data/handoff/sorter-qwen3.7-flash/<split>.targets.jsonl). The 32 label corrections and
      the unannotated merger subclass are the conventions this set already states (charter
      amendments, Certificates of Designation as officer_certificate, bylaws vs charter).
      Next: reviewer-calibration-luna-decisions-v3.1.0-train, all 2,979 train documents with the
      sorter handoff (preflight prepared; about 20.5M input tokens, about $2.05; cap $2.60).
    open_for_4.0.0: >-
      Derive continue / correct subclass / reclassify in code from the doc_type and subclass
      answers against the handoff, and keep only the human edge cases as a model question.
  - version: 3.2.0
    file: reviewer_decisions_v3.2.0.yaml
    parent: 3.1.0
    status: candidate
    summary: >-
      A bylaw amendment is bylaws, never board_resolution (mailroom-dataset v10 corpus rule C);
      the bylaws and board_resolution meanings are the only change from 3.1.0.
    adoption: >-
      Not the default until a calibration run supports it; 3.1.0's runs do not carry over.
      3.1.0 stays frontrunner and the 3.1.0 run configs stay pinned to 3.1.0.
  - version: 4.0.0
    file: reviewer_decisions_v4.0.0.yaml
    parent: 3.1.0
    status: candidate
    summary: >-
      MAJOR: no verdict question and no sorter handoff in the model's state (continue, correct
      subclass and reclassify are derived in code); a document_form question parks fragments,
      bundles, unreadable and non-English input; every subclass question can abstain and a
      per-class subclass_gate decides what a low subclass does (park for merger_agreement and
      corporate_record, keep the sorter's otherwise); abstain rules read the probability
      vector; max_input_chars covers the whole largest document.
    adoption: >-
      Registered 2026-11-18 (the file landed in 1728c856 without a lineage entry). Not the
      default until a calibration run supports it; abstain and subclass_gate thresholds are
      provisional. The evaluation runbook's decision question sets start from this version.
    open_for_4.2.0: >-
      Calibrate the abstain thresholds and a per-class subclass cutoff on calibration-set
      runs, as calibrate_reviewer already does for the class cutoffs.
  - version: 4.0.1
    file: reviewer_decisions_v4.0.1.yaml
    parent: 4.0.0
    status: candidate
    summary: >-
      PATCH: document_form criteria only. A document's own annexes, exhibits, schedules,
      amendments, index of defined terms and the supporting papers of the same matter are one
      document; blank signature lines on a form are complete; multiple_documents means
      unrelated documents. Everything else is 4.0.0.
    adoption: >-
      Registered 2026-11-19 after the rb1 R13b smoke, where 4.0.0 parked 5 of 20 dev-look1
      documents and all 5 were false parks (two FNOL claim files with their invoice, a merger
      with its amendment, a merger ending in its index, an unsigned form exhibit). The fix was
      written from those dev-look1 documents, so dev-look1 figures are in-sample for it. Not the
      default until a run with positive controls (real fragments and bundles) shows it still
      parks them.
  - version: 4.0.2
    file: reviewer_decisions_v4.0.2.yaml
    parent: 4.0.1
    status: candidate
    summary: >-
      PATCH: document_form instructions and criteria only. Names the signs of a fragment (cut
      off mid-word or mid-sentence, a form with its heading but no body) and of a bundle (a
      filing footer or <DOCUMENT> wrapper before a different matter), and says an email is
      judged by its newest message and a filed agreement as filed. Everything else is 4.0.1.
    adoption: >-
      Registered 2026-11-19 after the rb1 R13b form calibration (draw 1), where no human-mass
      floor parked every defect and 4.0.1 passed 9 defects and parked 5 intact documents. The
      wording was written from those 14 draw-1 documents, so draw-1 figures are in-sample. Not
      the default until calibration draw 2 (100 new documents, draw 1 excluded) gives "adopt"
      under the paired rule fixed before it ran (rb1_form_floor.py compare; see
      docs/rb1-r13b-smoke-review.md).
  - version: 4.1.0
    file: reviewer_decisions_v4.1.0.yaml
    parent: 4.0.2
    status: candidate
    summary: >-
      MINOR: class and subclass criteria only, so the handoff-free sorter questions match
      the primary classification node (classify_node, sorter_condensed_v5, sorter_guide).
      A bylaw amendment is bylaws, never board_resolution. Asset purchase and its extensions
      are supply. A unit purchase option is rights_instrument. Officer certificates are never
      rights_instrument. A charter stays articles_of_incorporation when its amendments are
      appended. Employment-letter termination stays consulting. An arbitration demand is a
      demand. document_form, abstain and subclass_gate stay 4.0.2.
    adoption: >-
      Pinned by the unrun H5 decision-sorter configs (dev-look1 and the sealed held-out
      template). Not the reviewer frontrunner: 3.1.0 still reads a sorter handoff. Form
      wording is 4.0.2's and stays unadopted until draw 2. Abstain thresholds stay provisional.
    open_for_4.2.0: >-
      Calibrate the abstain thresholds and a per-class subclass cutoff on calibration-set
      runs, as calibrate_reviewer already does for the class cutoffs. 4.0.0 reserved this
      for 4.1.0; 4.1.0 was used for the classification-node alignment instead.
  - version: 4.2.0
    file: reviewer_decisions_v4.2.0.yaml
    parent: 4.1.0
    status: draft
    summary: >-
      MINOR: what the model reads changes, the classes and criteria stay 4.1.0. state is always
      {"document": ...} (4.0.x named state.document but sent bare text); every question opens
      with an untrusted-data notice; code passes form_signals (length, window cut, last 240
      characters, <DOCUMENT>/<TYPE> and "Source:" counts); document_form becomes four yes/no
      flags (fragment, bundle, unreadable, non_english); subclass questions drop
      not_this_class for a separate fit__<class> yes/no question; correspondence markers say a
      denial does not count; unanswered questions are recorded and a refused doc_type or form
      flag parks; requests carry session_id = the run id. Design: docs/decision-model-input-design.md.
    adoption: >-
      Drafted 2026-11-20 from the docs, code and split files; no run, no API call. Before live
      adoption, enforce Python routing identity in locks and resume checks; the YAML hash alone
      does not protect routing-code identity. Reserve fitting/reporting halves before probes,
      keep all probes in the fitting half, and freeze questions and thresholds before reporting.
      Thresholds
      are provisional. Before any comparison: a smoke on runbook-v2 calibration documents
      (never dev-look1, which is all tuned, never held-out) that shows the object state, the
      flags and the fit questions answered, and the refusal record populated or empty. Judged
      against 4.0.2 on the same runbook-v2 calibration draw under a paired rule fixed before it
      runs; the separate-fit form is compared with an in-question option ablation before it is
      kept (OpenRouter's question-design guidance says to test both).
