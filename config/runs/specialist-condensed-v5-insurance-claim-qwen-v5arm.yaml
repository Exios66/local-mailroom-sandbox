# Specialist-condensed lineage, validation of insurance_claims_specialist_condensed_v5: v4 (adopted on the
# v4 A/B) fused with llm-mailroom #280 (#174 section 2), which makes claim_type the line of business in the
# pipeline's schema description, extract-node handoff and enrichment.
# Run ONLY after the re-vendor that brings in #280. Before it, the structured-output schema still asks
# for CMS table tokens and outweighs any prompt (v4 A/B: 20 of 21 CMS rows kept a table token).
# Two arms on the SAME 40 documents as the v4 A/B (ranked draw, seed 1116), both on the new pins:
#   v4arm  v4 with job.pipeline_handoff (reference)
#   v5arm  v5 with job.pipeline_handoff (candidate)
# Compare: python scripts/compare_specialist_prompt.py \
#   --reference specialist-condensed-v5-insurance-claim-qwen-v4arm --candidate specialist-condensed-v5-insurance-claim-qwen-v5arm
# The documents are already in excluded-ids.txt (the v4 A/B), so no production slice contains them.
#
#   sandbox run preflight --config config/runs/specialist-condensed-v5-insurance-claim-qwen-v5arm.yaml
#   sandbox run start --config config/runs/specialist-condensed-v5-insurance-claim-qwen-v5arm.yaml --initials XX
schema: sandbox.run/v1
run_id: specialist-condensed-v5-insurance-claim-qwen-v5arm
task: insurance_claims_specialist
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v5}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  strata:
    buckets:
      - {doc_class: insurance_claim, count: 40}
  limit: 40
  sample_seed: 1116
  require_task_gt: true
  interim_labels: true
  exclude_ids_file: config/production/excluded-ids-insurance-v4-ab.txt
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 12
  cost_cap_usd: 1.00
  max_wall_seconds: 3600
  api_cost_cap_usd: 0.10
  pipeline_handoff: true

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, specialist-condensed-v5, ab-validation, llm-mailroom-280, insurance-claim, slice-gate-fix-loop]
