# 50-doc DEMO slice of the even-100 shuffled corpus for the LIVE floor viewer
# (floor.template.html RUNNING pills + 3s digest poll). Same constraints as the
# even-100 shuffled run: profile lmstudio, engine qwen3.5-9b on :1234,
# concurrency 4, JSON_MODE off, thinking/reasoning OFF in the LM Studio GUI.
# The dataset is a REGISTRY KEY (config/datasets.yaml), resolved under
# ${MAILROOM_BASE_DIR}, so no machine path lives in this file. limit 50 takes
# the first 50 rows in the file's canonical (shuffled) order, so intake stays
# class-blind — a real shuffle, not a stratum block.
#
#   sandbox run preflight --config config/runs/pipeline-lmstudio-even50-demo.yaml
#   sandbox run start --config config/runs/pipeline-lmstudio-even50-demo.yaml --initials GM --watch
#
# Prereqs: LM Studio running with qwen3.5-9b LOADED, reasoning/thinking OFF in
# the GUI; .wslconfig mirrored networking; .env MAILROOM_JSON_MODE=off and
# MAILROOM_BASE_DIR set to the directory that holds datasets/.
schema: sandbox.run/v1
run_id: pipeline-lmstudio-even50-demo
task: pipeline
profile: lmstudio

prompt:
  default: {source: code-default}

dataset:
  name: pipeline-even100-shuffled2
  limit: 50

engine:
  kind: vllm-remote
  model: qwen3.5-9b
  vllm:
    max_model_len: 65536
    max_inputs: 4
    enable_prefix_caching: true
    enforce_eager: true
  modal: null

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 4
  cost_cap_usd: 150.00        # same cap as the 500 run; local GPU bills $0 (estimator artifact)
  max_wall_seconds: 691200    # same ceiling; ~5-6 min/doc pace → 50 docs ≈ 4-5 h wall at conc 4

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, pipeline, lmstudio, local-gpu, even-100-per-class, shuffled-intake, demo-50, live-floor]
