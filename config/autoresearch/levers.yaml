  # ---- specialist input window: a NARROWER window (the baseline is already whole-document) ----
  # After context_fit the baseline's specialists on the 1M-context qwen/qwen3.7-flash read the whole document (up to
  # ~2.37M chars) in one window, so there is no wider window to try. The only window lever left is a narrower one, which
  # chunks long documents into sliding windows. E1 found chunking HURT contracts; this tests whether it helps mergers.
- id: merger-agreement-window-400k
  node: merger_agreement_specialist
  classes: [merger_agreement]
  description: 'Narrower window: tests whether chunking long mergers helps (merger_agreement_specialist max_input_chars 400000; the whole-document baseline is the control, and E1 found chunking hurt contracts).'
  patch: {agent_knobs.merger_agreement_specialist.max_input_chars: 400000}

