# GitHub-flavored markdown lint (markdownlint-cli2, version pinned in .circleci/config.yml).
#
# Every rule is on except the ones listed with a reason. Rules that catch rendering
# bugs stay on: a wrapped line starting with "#123" becomes a heading (MD018), an
# unescaped "|" splits a table row (MD055/MD056), and a bare "<placeholder>" is dropped
# as an unknown HTML tag (MD033 allows only the layout tags below). Run locally with
#   npx --yes markdownlint-cli2@0.18.1
# and add `--fix` for the mechanical rules (blank lines, list markers, trailing newline).
config:
  default: true
  MD013: false            # line length: prose is not hard-wrapped in this repo
  MD041: false            # first-line h1: agent/skill prompts open with front matter and prose,
                          # release notes are GitHub release bodies, READMEs open with a centered <div>
  MD024:
    siblings_only: true   # repeated section names under different parents (per-run cards) are fine
  MD025:
    front_matter_title: ""  # agent files carry `title:` for the harness and still have one # heading
  MD033:
    allowed_elements: [a, b, br, code, details, div, i, img, picture, source, sub, summary, sup]
  MD004:
    style: dash
  MD029:
    style: one_or_ordered
  MD046:
    style: fenced
  MD048:
    style: backtick
  MD049:
    style: consistent
  MD050:
    style: consistent
  MD055:
    style: leading_and_trailing
globs:
  - "**/*.md"
ignores:
  - vendor/**             # byte-pinned snapshots
  - .venv/**              # local virtualenv (site-packages ship their own markdown)
  - node_modules/**
  - data/**               # label and runtime data
  - reports/**            # generated run reports and cards
  - docs/prompts/**       # frozen prompt texts, byte-compared by tests
  - docs/cli-reference.md # generated by scripts/check_cli_surface.py
