# Qwen3-8B-AWQ specialist grid cell (v1 / simplified stem) — SAND-037 n=20 1×L4 twin.
# Same dataset block as the 2×L4 sibling (grid-20-insurance-claims-specialist-awq-2l4), so the pair shares one draw.
# 1xL4 c=8, thinking off, MODAL_VLLM_MAX_INPUTS=8 (never 0 — that serializes HTTP).
# Decode 8192 via start-time SANDBOX_AGENT_KNOBS (specialist_posture grid row).
# Runbook: sandbox runbook show grid-1l4
schema: sandbox.run/v1
run_id: grid-20-insurance-claims-specialist-awq-1l4
task: insurance_claims_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    insurance_claims_specialist:
      source: local
      file: insurance_claims_specialist_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: test
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - doc_class: insurance_claim
        sub_buckets:
          - {subclass: auto, count: 4}
          - {subclass: carrier, count: 4}
          - {subclass: property, count: 4}
          - {subclass: inpatient, count: 4}
          - {subclass: outpatient, count: 2}
          - {subclass: pde, count: 2}
  limit: 20
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 8
    enable_prefix_caching: true
    enforce_eager: true
    quantization: awq
    revision: ""
    enable_thinking: false
    max_inputs: 8
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 1
    min_containers: 1
    prewarm: true
job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 8
  cost_cap_usd: 0.4
  max_wall_seconds: 2400

trace:
  sink: none
  otlp: false
  environment: qwen-grid
  tags: [sandbox, job, specialist, qwen3-8b-awq, l4, grid]
