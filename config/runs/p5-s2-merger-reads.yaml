# Phase 5 part 2, the merger arm: config/runs/p4-s1-verify-gov-off.yaml (the stage-1 baseline) with the three
# merger switches, job.long_document_head and the merger judge off (judge_max_passes 0, arbiter_retry_max 0).
# Nothing else changes; tests/test_merger_arms.py pins that.
# Design: docs/design/specs/2026-11-27-phase5-merger-maud-design.md (part 8, "Measurement plan")
# Plan: docs/design/plans/2026-11-27-phase5-merger-maud.md (Task 8)
#
# What it changes (sandbox hotfixes, docs/vendor-hotfixes.md):
#   HF-030  job.merger: subclass fields, MAUD question-group reads from located sections, one gap retry, and the
#           route rule that honours the merger judge_max_passes 0 (the vendored routers ignore it);
#   HF-032  the sorter reads the head and tail of a document over 150,000 characters;
#   HF-033  intake reads only the first 40,000 characters of such a document (its text is never replaced).
# Expected reads per merger: about 2 whole-document equivalents, against 3 or more today; preflight prints the
# estimate for the drawn mergers (merger_reads block). api_cost_cap_usd stays 9.0 (the baseline's).
#
# Measurement plan (owner-run, in order; spec part 8):
#   1. the baseline, p4-s1-verify-gov-off, from a checkout that includes this work (switches off);
#   2. the offline locator check (no spend);
#   3. the near-gold merger labels (paid), then the human spot check:
#        python scripts/merger_spot_check.py --labels <merger labels jsonl> --seed <int> --n 5
#        python scripts/merger_spot_check.py --labels <merger labels jsonl> --record <marked sheet>
#   4. the sorter check, p5-s2-head-sorter-off and -on;
#   5. this arm;
#   6. compare: sandbox run gate on both runs, gate_compare for MAUD (paired per-class deltas), then
#        python scripts/merger_entity_check.py --run p5-s2-merger-reads --baseline p4-s1-verify-gov-off --labels <jsonl>
#      and the per-step usage for the read count.
# Adoption bars (paired documents): MAUD accuracy +0.05 or more (a direction check at n = 20); no entity field with
# 5 or more labels down by more than 0.05; at most 2.5 whole-document-read equivalents and no more billed dollars
# per merger than the baseline; no new crash or judge_error on mergers; the other classes unchanged.
#
# Labels: the rc.10 staged overlay. Pull it first (GitHub access, no spend):
#   python scripts/pull_staged_overlay.py --version 9.3.1-rc.10
# Launch ONLY with a person's initials (a human supplies them; never launch from an agent):
#   sandbox run preflight --config config/runs/p5-s2-merger-reads.yaml
#   sandbox run start --config config/runs/p5-s2-merger-reads.yaml --initials <XX>

schema: sandbox.run/v1
run_id: p5-s2-merger-reads
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v3}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 84}
      - {doc_class: corporate_record, count: 56}
      - {doc_class: correspondence, count: 66}
      - {doc_class: insurance_claim, count: 74}
      - {doc_class: merger_agreement, count: 20}
  limit: 300
  sample_seed: 3302
  require_task_gt: true
  staged_overlay: 9.3.1-rc.10
  exclude_ids_file: config/splits/runbook-v2/dev-look1.exclude.ids   # every document outside dev-look1
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    corporate_record: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    correspondence: {judge_max_passes: 2, arbiter_retry_max: 1}
    insurance_claim: {judge_max_passes: 2, arbiter_retry_max: 1}
    merger_agreement: {judge_max_passes: 0, arbiter_retry_max: 0}   # HF-030's route rule honours 0

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

judge:
  mode: verify               # today's judge, plus the per-ruling record (HF-025)

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50         # GPU cap field (validation requires one); OpenRouter spend is capped below
  max_wall_seconds: 10800
  api_cost_cap_usd: 9.0
  require_expanded_inputs: true
  blind_routing: true
  merger: {subclass_fields: true, question_groups: true, gap_retry: true}
  long_document_head: true

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, phase5, part-2, merger-reads, long-document-head]
