  - {row: r32, slug: sorter-transfer, phase: "3 Sorter iteration", title: "Transfer the final sorter to the stronger models"}
  - {row: g3, slug: checkpoint, phase: "3 Sorter iteration", title: "Phase 3 checkpoint"}
  - {row: r40, slug: specialist-noise-floor, phase: "4 Specialists", title: "Specialist noise floor across lineages"}
  - {row: r41, slug: specialist-iteration, phase: "4 Specialists", title: "Specialist iteration"}
  - {row: r42, slug: specialist-transfer, phase: "4 Specialists", title: "Transfer final specialists to the production extractor"}
  - {row: g4, slug: checkpoint, phase: "4 Specialists", title: "Phase 4 checkpoint"}
  - {row: r50, slug: calibration-run, phase: "5 Calibration", title: "Final sorter on the production model over the calibration set"}
  - {row: r51, slug: calibration-fit, phase: "5 Calibration", title: "Fit calibrators and certify gates"}
  - {row: g5, slug: checkpoint, phase: "5 Calibration", title: "Phase 5 checkpoint"}
  - {row: r60, slug: decision-screen, phase: "6 Decision models", title: "Screen decision models in all three roles"}
