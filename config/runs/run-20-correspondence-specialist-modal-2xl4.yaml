# Specialist extract: correspondence_specialist on 20 CORRESPONDENCE docs.
# Same as run-20-correspondence-specialist-modal.yaml with max_containers=2 (2×L4).
# 7 largest FULL-corpus communication types, Hamilton-proportional (sum 20).
# split: all (train+test union via expand_hf_splits; Hub has no validation
# split). Full pool: 1000 correspondence rows. attorney_demand avail 3 —
# Hamilton remainder 0 at N=20/40, omitted (not test-only exclusion).
# Grant-parity ladder cell (docs/grant-parity-ladder.md). HARD HOLD until
# explicit go — YAML-only; do not modal deploy / download / start from this PR.
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ CUT SPEND (DMR-076/077/078) — MANDATORY operator posture                 ║
# ║  1. ONE warm sandbox-vllm app through the Grant ladder (or this cell).   ║
# ║  2. Do NOT tear down / redeploy / stop between ladder cells.             ║
# ║  3. Teardown ONLY after your last: ./deploy/teardown_vllm.sh             ║
# ║  4. scaledown_seconds: 120 (attended). Unattended/overnight → restore 600║
# ║  5. Default model: Qwen/Qwen3-8B bf16. AWQ optional (DMR-068 gate).       ║
# ║  6. Suite: config/runs/suites/grant-parity-contracts-correspondence.yaml ║
# ║  7. Jack/Grant lock concurrency=8 (flat; 2×L4 only raises replicas); cost_cap=$0.50, wall=1500s. ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
#   # Same warm app — do NOT redeploy before this run. After explicit go:
#   export MODAL_TOKEN_ID=… MODAL_TOKEN_SECRET=…   # Hermes profile NOT required
#   export MODAL_VLLM_MAX_CONTAINERS=2
#   sandbox run preflight --config config/runs/run-20-correspondence-specialist-modal-2xl4.yaml --live
#   sandbox run start --config config/runs/run-20-correspondence-specialist-modal-2xl4.yaml --job-mode endpoint --watch
#   sandbox metrics compare --runs run-20-correspondence-specialist-modal-2xl4 --json
schema: sandbox.run/v1
run_id: run-20-correspondence-specialist-modal-2xl4
task: correspondence_specialist
profile: modal-vllm

prompt:
  # Pinned local production text (config/prompts/correspondence_specialist_production.txt) for reproducible
  # Modal L4 Qwen runs — not Langfuse floating production. DMR-074/078.
  default: {source: code-default}
  agents:
    correspondence_specialist:
      source: local
      file: correspondence_specialist_production

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  # split: all → expand_hf_splits unions train+test (no validation split on Hub)
  # correspondence = 1000 rows at FAMILY_HF_REVISION (train 915 + test 85)
  split: all
  revision: 46a4d3c240a36671cde0182fff4960f6b8b73aca   # Hub tip = FAMILY_HF_REVISION
  strata:
    buckets:
      # 7 largest FULL-corpus communication types → 20 (Hamilton)
      # avail: email557 memo83 notice81 letter79 press_release78 demand66
      # meeting_request53; attorney_demand 3 → remainder 0, omitted
      - doc_class: correspondence
        sub_buckets:
          - {subclass: email, count: 11}               # avail 557
          - {subclass: memo, count: 2}                 # avail 83
          - {subclass: notice, count: 2}               # avail 81
          - {subclass: letter, count: 2}               # avail 79
          - {subclass: press_release, count: 1}        # avail 78
          - {subclass: demand, count: 1}               # avail 66
          - {subclass: meeting_request, count: 1}      # avail 53
  limit: 20
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B
  vllm:
    max_model_len: 16384      # boot-valid cap for L4-bf16 8B (v0.29.0 raises above)
    gpu_memory_utilization: 0.90
    max_num_seqs: 256
    quantization: ""
    revision: ""
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    # Attended cost-saver (DMR-076). Unattended/overnight: restore 600 here
    # and export MODAL_VLLM_SCALEDOWN_SECONDS=600 before redeploy.
    scaledown_seconds: 120
    # 2×L4 for GPU parallelism; concurrency stays Jack/Grant lock 8;
    # expect higher $/hr until scaledown.
    max_containers: 2
    min_containers: 0         # scale-to-zero after idle
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 8              # Jack/Grant lock — flat 8 across the ladder (not DMR-078 posture 5)
  cost_cap_usd: 0.50       # abort if wall×L4 $/hr exceeds (2 replicas)
  max_wall_seconds: 1500    # hard wall abort

trace:
  sink: none
  otlp: false
  environment: grant-parity
  tags: [sandbox, job, specialist, correspondence, qwen3-8b, l4, grant-parity, n20, 2xl4]
