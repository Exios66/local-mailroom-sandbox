# #214 confidence-threshold calibration — the full production pipeline on the runbook-v2
# CALIBRATION split, 30 documents per class (150), with the judge verifying every first pass.
# Question: which per-class `judge_band_high` (skip the judge above it) and `low` (retry below
# it) give the best full-pipeline quality, wrong-archive and review rates?
# Why: specialist self-confidence does not separate quality on its own. On the #214 contracts
# runs, documents at final confidence >= 0.85 scored 0.584 (r1) and 0.665 (r2) against 0.644
# below it. The band has to be read off judged outcomes, not the specialist's number.
#   config  = production slice-0100 (adopted routes, prompts, reviewer, blind routing,
#             staged overlay 9.3.1-rc.9, require_expanded_inputs; OpenRouter whole-document
#             reads, no chunking: HF-009/HF-010). Changes: the draw (calibration split only,
#             seed 214, 30 per class), judge_band_high 1.01 on every class, caps, run_id.
#   read    = sandbox run routing --run-id sand214-pipeline-150-calibration-judge-all
#             (judge_band_suggestion, above_band per candidate band, retry yield, fire rates).
#             Retried extractions drop out of the band fit (their score is the retry's).
#   adopt   = a class's band moves only when the suggestion holds with >= 5 scored documents
#             above it; otherwise the judge keeps verifying every extraction for that class.
#
# Launch (a human supplies the initials):
#   sandbox run preflight --config config/runs/sand214-pipeline-150-calibration-judge-all.yaml
#   sandbox run start --config config/runs/sand214-pipeline-150-calibration-judge-all.yaml --initials <XX>
schema: sandbox.run/v1
run_id: sand214-pipeline-150-calibration-judge-all
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}   # sorter: vendored sorter_condensed_v5 (the adopted frontrunner)
  agents:   # adopted condensed frontrunners (config/prompts/specialist_condensed_lineage.yaml)
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v3}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 30}
      - {doc_class: corporate_record, count: 30}
      - {doc_class: correspondence, count: 30}
      - {doc_class: insurance_claim, count: 30}
      - {doc_class: merger_agreement, count: 30}
  sample_seed: 214
  require_task_gt: true     # every document can be scored
  # Staged v10 label repairs from mailroom-issues mailroom_cache (pinned in config/staged_overlays.yaml):
  # the merged Hub + interim + near-gold + reviewed master, so it replaces interim_labels / near_gold_labels.
  # Pull it first: python scripts/pull_staged_overlay.py --version 9.3.1-rc.9 (docs/staged-label-overlay.md).
  staged_overlay: 9.3.1-rc.9
  exclude_ids_file: config/runs/sand214-pipeline-calibration.exclude.ids   # calibration split only

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  # TREATMENT: judge_band_high 1.01 sends every first-pass extraction at or above `low` to the
  # judge, so first-pass quality is observed across the whole confidence band. `low` stays at
  # the taxonomy's 0.70: it also gates the sorter, and moving it would change classification
  # routing. Production's other per-class settings are kept.
  by_class:
    contract: {high: 0.95, judge_band_high: 1.01}
    corporate_record: {high: 0.95, judge_band_high: 1.01}
    correspondence: {judge_band_high: 1.01}
    insurance_claim: {judge_band_high: 1.01}
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2, judge_band_high: 1.01}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50         # GPU cap field (validation requires one); OpenRouter spend is capped below
  max_wall_seconds: 10800
  # Upper bound from list prices (config/api_prices.yaml), not a measurement: 13.47M chars
  # (30 whole mergers up to 436k) ~ 5.5M tokens; ~5 reads at the >=32k tier's $0.10/M prompt
  # ~ $2.8, plus an intake rewrite at up to $0.40/M completion ~ $2.2.
  api_cost_cap_usd: 6
  require_expanded_inputs: true
  blind_routing: true       # no dataset labels in the graph's state (llm-mailroom #207)

trace:
  sink: none          # no Docker: spans still mirror to data/traces/<run_id>.spans.jsonl.gz
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, issue-214, threshold-calibration, judge-all]
