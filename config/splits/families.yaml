# Subclass families for the runbook split (R00). A subclass with fewer than
# `min_scored` documents is scored through its family; a family with
# `min_scored`+ documents is scored like a subclass, a smaller one is a pooled
# group (>= `min_pooled_per_set` per set where the corpus allows).
# Frozen before any run: the split manifest records this file's sha256.
# Families group related agreement / record types; edit only before R00 runs.
min_scored: 30
min_pooled_per_set: 10
# Class-specific accept gates (decision 6): each class's gate is calibrated on its own
# calibration documents to `target_error` at `confidence` (zero-failure Clopper-Pearson:
# 149 error-free accepts for 2% at 95%). A class with fewer documents left after dev and
# held-out keeps all of them in calibration (none in the pool) and reports the tightest
# bound it can certify; it never falls back to the global gate.
calibration:
  target_error: 0.02
  confidence: 0.95
families:
  contract:
    licensing_ip: [Affiliate_Agreements, Franchise, Non_Compete_Non_Solicit]
    supply_distribution: [Agency Agreements, Reseller, Manufacturing, Transportation]
    services_outsourcing: [Hosting, Outsourcing, Development]
    alliances_jv: [Joint Venture, Joint Venture _ Filing, Collaboration]
    marketing_sponsorship: [Co_Branding, Endorsement, Marketing, Promotion]
  corporate_record:
    governance_instruments: [bylaws, powers_of_attorney, other]
  correspondence:
    legal_demand_rare: [attorney_demand]
  merger_agreement:
    stock_or_mixed: [all_stock, mixed_cash_stock, mixed_cash_stock_election]
