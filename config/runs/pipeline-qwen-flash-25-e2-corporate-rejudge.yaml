# Ladder E2 rejudge arm (pairs with -e2-corporate-control, the off arm). Default judge band; a retry
# whose first attempt was judged is judged again whatever confidence it reports (llm-mailroom #241,
# opt-in `judge_rejudge_retry`). Not paired with -e2-corporate-judge: with judge_band_high 1.01 every
# archivable extraction is already judged, so the switch cannot change that arm's routing.
# Sample: 18 corporate records, 2 from each of the 9 labelled subtypes. Tuning seed 1115.
# Success: the switch fires on at least one retry (nodes.jsonl: a judge_verify after a retry_extract that
# reported confidence >= 0.94), paired quality is no worse than control, and the added judge calls are counted. Few corporate first passes land in the band
# (r2: all reported 0.95 or more), so a zero-fire result is itself the finding.
# Model (held fixed across the ladder, so the only variable is the marked line): qwen/qwen3.7-flash on
# OpenRouter for every agent node; decision reviewer openai/gpt-6-luna-decisions with the v2 cutoffs.
# Plan: docs/audits/2026-11-15-contract-recall-routing-ladder.md. Base: pipeline-qwen-flash-25-fit-r2.
schema: sandbox.run/v1
run_id: pipeline-qwen-flash-25-e2-corporate-rejudge
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: bc9eab280044befb51e19dda3071d290a8677f42
  strata:
    buckets:
      - doc_class: corporate_record
        count: 18
        sub_buckets:
          - {subclass: "charter_amendment", count: 2}
          - {subclass: "articles_of_incorporation", count: 2}
          - {subclass: "officer_certificate", count: 2}
          - {subclass: "indenture", count: 2}
          - {subclass: "subsidiary_list", count: 2}
          - {subclass: "rights_instrument", count: 2}
          - {subclass: "board_resolution", count: 2}
          - {subclass: "bylaws", count: 2}
          - {subclass: "powers_of_attorney", count: 2}
  limit: 18
  sample_seed: 1115
  require_task_gt: true   # every document can be scored

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95}
    corporate_record: {high: 0.95, judge_rejudge_retry: true}   # TREATMENT: re-judge a retry after a judged attempt
    merger_agreement: {arbiter_retry_max: 1, judge_max_passes: 2}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50
  max_wall_seconds: 7200
  api_cost_cap_usd: 0.40   # ~2x the r2-derived estimate for this sample, dearest-tier pricing

trace:
  sink: none          # no Docker: spans still mirror to data/traces/<run_id>.spans.jsonl.gz;
                      # compact afterwards with `sandbox traces pack` (zstd Parquet zip)
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, n25, context-fit, routing-calibration, ladder-e2-corporate-rejudge]
