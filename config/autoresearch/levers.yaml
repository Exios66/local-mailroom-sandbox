# Autoresearch lever catalog for the mailroom-v1 study (schema sandbox.autoresearch.levers/v1).
#
# A lever is {id, node, classes, description, patch}; a candidate is the champion plus ONE lever's patch
# (dotted paths, null deletes a key), validated as a RunSpec before it is run. `node` names the weakness-table
# row the lever answers (sorter, reviewer, intake, judge, arbiter, boss or a *_specialist); the loop tries levers
# attached to the champion's worst node first, then lower `tier` first, then catalog order.
#
# ROUND CAPS: a round runs under job.api_cost_cap_usd = the study's round cap, except a lever with `round_cap_usd` (explicit)
# or `round_cap_auto: true` (every supervisor lever and the placements derived from one). The runtime ApiBudget prices
# EVERY token of a run at the dearest API model in it, so a supervisor round costs far more than its per-agent estimate:
# the auto cap is the runtime-bound estimate x 1.2, rounded up to $0.25, within [round cap, budget.max_round_cap_usd]
# (1.5 / 3 / 4 USD for tier 1 / 2 / 3 until the champion has a token measurement). `estimate_safety` scales the pre-run
# estimate of a lever that adds model calls.
#
# Order of the groups below is the tie-break order inside a node. Levers that need something the machine may not
# have (`requires_env`) are never proposed without it.
#
# The champion's reviewer is the CHAT reviewer (the base spec has no `reviewer` block). Every reviewer lever below
# is a TRUE Decisions-API model from config/decision_models.yaml (`scripts/refresh_decision_models.py --check`);
# never a chat model with a similar name (typesafe/jev-router is chat), never a `~alias` or `-latest`, never the
# `jev` or `api` backends.
#
# UNCALIBRATED CUTOFFS: the per-class cutoffs are reviewer_decisions_v2's, tuned for openai/gpt-6-luna-decisions on
# question set v2. They are reused as-is for the other question sets (v3.1.0, v3.2.0, v4.0.0) and for every non-Luna
# model: the study measures them at those cutoffs, it does not calibrate them. A cutoff that is wrong for a model
# shows up as review-rate or wrong-archive movement, not as a bug.
#
# CONTEXT CAPS: no per-run override exists for a reviewer's input cap, so the question set's `max_input_chars` is the
# cap (reviewer_decisions_v2: 120000 chars ~ 30k tokens + ~4k question tokens). `validate_catalog` checks every
# reviewer lever's request size against the model's context_length in config/decision_models.yaml: v2 fits the 64k
# window of liquid/d1.2; the longer question sets only fit Luna (1.05M tokens). OPEN QUESTION: a per-run
# `reviewer.max_input_chars` would let the small-context models see longer documents; it does not exist today.
schema: sandbox.autoresearch.levers/v1
levers:

  # ---- reviewer: Decisions-API models (the champion's chat reviewer is the baseline) ----
- id: rev-luna-v2
  node: [reviewer, sorter]
  classes: all
  group: reviewer
  description: 'Luna Decisions reviewer, question set v2: the production reviewer (calibrated cutoffs).'
  patch:
    reviewer:
      backend: decisions
      model: openai/gpt-6-luna-decisions
      questions: reviewer_decisions_v2
      classes: {contract: 0.78, merger_agreement: 0.99, corporate_record: 0.96, correspondence: 0.64, insurance_claim: 0.7}

