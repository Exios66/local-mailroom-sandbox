# Phase 4 correcting judge, stage 2: today's judge, governor on.
# Plan: docs/design/plans/2026-11-26-phase4-correcting-judge.md (Task 8)
# Spec: docs/design/specs/2026-11-26-correcting-judge-design.md ("The test, in stages")
#
# The production setup (config/runs/production/slice-0250.yaml: prompts, engine, agent routes and
# knobs, decision reviewer, blind routing, staged labels) on runbook-v2 dev (900 documents), with
# today's tightened loop limits on every class (judge_max_passes 2, arbiter_retry_max 1).
# api_cost_cap_usd 27.0: pipeline term only (900 x $0.02), x1.5: today's judge is inside the pipeline cap.
#
# Labels: the rc.10 staged overlay, the current cut (owner, 2026-11-27); main's production slices are still
# on rc.9 until #425 moves them. Pull it first (GitHub access, no spend):
#   python scripts/pull_staged_overlay.py --version 9.3.1-rc.10
# Launch (a human supplies the initials; never launch from an agent):
#   sandbox run preflight --config config/runs/p4-s2-verify.yaml
#   sandbox run start --config config/runs/p4-s2-verify.yaml --initials <XX>
# Compare (stage 2): gate_compare.judge_compare(<today's judge run>, <correcting judge run>, bars, stage=2)

schema: sandbox.run/v1
run_id: p4-s2-verify
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}
    correspondence_specialist: {source: local, file: correspondence_specialist_condensed_v3}
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ff4ca546d4346991628c2616ae014afc15e9fe04
  strata:
    buckets:
      - {doc_class: contract, count: 247}
      - {doc_class: corporate_record, count: 164}
      - {doc_class: correspondence, count: 201}
      - {doc_class: insurance_claim, count: 229}
      - {doc_class: merger_agreement, count: 59}
  limit: 900
  sample_seed: 3302
  require_task_gt: true
  staged_overlay: 9.3.1-rc.10
  exclude_ids_file: config/splits/runbook-v2/dev.exclude.ids   # every document outside dev
  draw: ranked

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

confidence:
  by_class:
    contract: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    corporate_record: {high: 0.95, judge_max_passes: 2, arbiter_retry_max: 1}
    correspondence: {judge_max_passes: 2, arbiter_retry_max: 1}
    insurance_claim: {judge_max_passes: 2, arbiter_retry_max: 1}
    merger_agreement: {judge_max_passes: 2, arbiter_retry_max: 1}

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: reviewer_decisions_v2
  classes:
    contract: 0.78
    merger_agreement: 0.99
    corporate_record: 0.96
    correspondence: 0.64
    insurance_claim: 0.70

judge:
  mode: verify               # today's judge, plus the per-ruling record (HF-025)

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50         # GPU cap field (validation requires one); OpenRouter spend is capped below
  max_wall_seconds: 32400
  api_cost_cap_usd: 27.0
  require_expanded_inputs: true
  blind_routing: true
  governor: true            # phase 2 loop governor at the design's starting budgets

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, qwen3.7-flash, decision-reviewer, phase4, stage-2, judge-verify]
