# SAND-085: calibrate the OpenRouter decision reviewer's per-class cutoffs.
#
# Reviewer only; the labels come from the corpus. About 3,200 input and 110
# output tokens per document, so 200 documents list at about $0.07. A signed `sandbox run start` is the spend approval.
# Afterwards:
#   python scripts/calibrate_reviewer.py --run reviewer-calibration-luna
schema: sandbox.run/v1
run_id: reviewer-calibration-luna
task: sorter_reviewer
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: train   # test stays untouched for final evaluation; it has only 17 mergers
  revision: ed7576b676343e0b402ec5412cded301e629bdee   # pinned (FAMILY_HF_DATA_REVISION)
  strata:
    buckets:
      - {doc_class: contract, count: 40}
      - {doc_class: merger_agreement, count: 40}
      - {doc_class: corporate_record, count: 40}
      - {doc_class: correspondence, count: 40}
      - {doc_class: insurance_claim, count: 40}
  limit: 200
  sample_seed: 42

engine:
  kind: openrouter
  model: openai/gpt-6-luna
  modal: null

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 4
  cost_cap_usd: 0.50
  max_wall_seconds: 1800
  api_cost_cap_usd: 0.25

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, reviewer-calibration]
