# Qwen3-8B-AWQ specialist grid cell (v1 / simplified stem).
# Keep GPU warm (min_containers pinned); teardown only after the shape queue.
# 1xL4 c=8; 2xL4 c=32 (16 per replica). PHOENIX_TRACING=disabled at launch.
# Decode 8192 via start-time SANDBOX_AGENT_KNOBS (clears 4096 LengthFinish JSON).
schema: sandbox.run/v1
run_id: grid-20-corporate-records-specialist-awq-2l4
task: corporate_records_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist:
      source: local
      file: corporate_records_specialist_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: test
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - doc_class: corporate_record
        sub_buckets:
          - {subclass: subsidiary_list, count: 4}
          - {subclass: charter_amendment, count: 4}
          - {subclass: officer_certificate, count: 3}
          - {subclass: board_resolution, count: 2}
          - {subclass: articles_of_incorporation, count: 2}
          - {subclass: indenture, count: 2}
          - {subclass: powers_of_attorney, count: 1}
          - {subclass: rights_instrument, count: 1}
          - {subclass: bylaws, count: 1}
  limit: 20
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 16
    enable_prefix_caching: true
    enforce_eager: false
    quantization: awq
    revision: ""
    kv_cache_dtype: "fp8"
    enable_thinking: false
    cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    max_inputs: 32
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 2
    min_containers: 2
    prewarm: true
job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 32
  cost_cap_usd: 0.5
  max_wall_seconds: 2400

trace:
  sink: none
  otlp: false
  environment: qwen-grid
  tags: [sandbox, job, specialist, qwen3-8b-awq, l4, grid]
