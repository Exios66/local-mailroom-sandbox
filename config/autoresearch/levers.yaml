  # ---- supervisors: stronger models in the oversight roles (judge, arbiter, boss) ----
  # classification_arbiter is a graph NODE of the `arbiter` AGENT, so `agent_routes.arbiter` routes it.
  # Tier 1 is tried first. Tier 2 opens when a tier-1 lever was kept OR every tier-1 lever was reverted with a
  # positive mean delta (the direction is right, the model is too weak). Tier 3 opens when a tier-2 lever was kept
  # AND the remaining study budget is at least 3 round caps. After a supervisor wins, `placements` below derive
  # cost levers that keep it on fewer roles.
- id: sup-gpt-6-luna
  node: [judge, arbiter, boss]
  classes: all
  tier: 1
  group: supervisor
  round_cap_auto: true
  requires: []
  description: openai/gpt-6-luna as judge, arbiter and boss (supervisor tier 1).
  patch:
    agent_routes.judge: {provider: openrouter, model: openai/gpt-6-luna}
    agent_routes.arbiter: {provider: openrouter, model: openai/gpt-6-luna}
    agent_routes.boss: {provider: openrouter, model: openai/gpt-6-luna}

