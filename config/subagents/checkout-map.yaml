# Physical checkout locations for family subagent propagation.
# Used by: sandbox subagents propagate

version: 1
monorepo_env_vars: [MAILROOM_DEV_ROOT, MONOREPO_ROOT]
default_monorepo_sibling: mailroom-dev

checkouts:
  mailroom-dev:
    monorepo_relative: "."
  llm-mailroom:
    monorepo_relative: "packages/llm-mailroom"
  llm-entity-extraction:
    monorepo_relative: "packages/llm-entity-extraction"
  local-mailroom-sandbox:
    monorepo_relative: "packages/local-mailroom-sandbox"
    standalone: true
